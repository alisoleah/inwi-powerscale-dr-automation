---
# One entry per share to provision (Phase 1) and replicate (Phase 2).
# Every field's validation rule is enforced by roles/validate_input BEFORE
# any cluster is contacted - run `ansible-playbook playbooks/validate_input.yml`
# after editing this file to check it.
#
# Field reference:
#   name                          required, alphanumeric/underscore/hyphen only, unique
#   path                          required, must start with /ifs/
#   access_zone                   optional, defaults to "System"
#   owner                         optional, defaults to "root" - the local (or
#                                  ldap/ads/file, see owner_provider_type)
#                                  account that should own the share's directory
#   owner_provider_type           optional, defaults to "local" - one of:
#                                  local, file, ldap, ads (matches the
#                                  dellemc.powerscale.filesystem module's
#                                  owner.provider_type options)
#   protocol                      required, non-empty list of "nfs" and/or "smb"
#   primary_site                  required, must be a key in sites.yml
#   quota_gb                      optional, positive integer if set
#   nfs_clients                   required (non-empty) if "nfs" in protocol
#   nfs_read_only_clients         optional
#   smb_permissions               required (non-empty) if "smb" in protocol
#     - user OR group             one of the two required per entry
#       permission                one of: read, write, full (exact values the
#                                  dellemc.powerscale.smb module accepts)
#   replication.target_site       required, must be a key in sites.yml, != primary_site
#   replication.schedule          required, non-empty string (SyncIQ schedule expression)
#   replication.rpo_alert_minutes optional, positive integer if set
shares:
  - name: "finance_data"
    path: "/ifs/data/finance"
    access_zone: "System"
    protocol: ["nfs", "smb"]
    primary_site: "site_a"
    quota_gb: 500
    nfs_clients:
      - "10.10.0.0/16"
    nfs_read_only_clients: []
    smb_permissions:
      - user: "INWI\\finance_team"
        permission: "write"
    replication:
      target_site: "site_b"
      schedule: "every 4 hours"
      rpo_alert_minutes: 60

