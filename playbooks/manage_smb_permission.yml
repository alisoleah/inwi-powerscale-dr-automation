---
# Add or remove a single user/group/wellknown permission entry on an
# EXISTING SMB share, fully ad-hoc via extra_vars/Survey - no shares.yml or
# sites.yml edits needed. Idempotent, with automatic rollback of the
# share's full permission list if anything fails after the change.
#
# Verified against the real installed dellemc.powerscale 3.10.0 collection
# (ansible-doc dellemc.powerscale.smb) before writing this - in particular:
#   - UNLIKE nfs's client_state, this module has no per-entry add/remove
#     primitive, AND its `permissions` param is NOT a full replace: it
#     MERGES the given list into the share's existing entries (see
#     make_permissions() in the module source - every trustee already on
#     the share but absent from the list is kept). So the module can add
#     or modify an entry, but can never revoke one. This playbook
#     therefore:
#       add      -> module, passing ONLY the new entry
#       revoke   -> OneFS REST API PUT /platform/1/protocols/smb/shares/<name>
#                   with the full remaining list (a true replace),
#                   authenticated by API session (basic auth is off on
#                   recent OneFS)
#       rollback -> same REST PUT with the original list
#     (found on a live cluster: a module-based revoke reported "no change"
#     and the entry stayed.)
#   - the return value is `smb_details.shares[0].permissions`, each entry
#     shaped as {permission, permission_type, trustee: {name, type, id}} -
#     the same shape the REST PUT accepts, so it is reused as-is.
#   - OneFS stores "write" as "change". The module translates on input,
#     but reads return "change", so comparisons map write -> change.
#
# Required extra_vars:
#   target_site      site_a | site_b
#   share_name       must be an EXISTING SMB share (this playbook edits
#                    permissions, it does not create new shares - use
#                    provision_share.yml for that)
#   trustee_type     user | group | wellknown
#   trustee_name     e.g. "INWI\\finance_team", or "everyone" for wellknown
#   permission       read | write | full
#   state            present | absent
# Optional:
#   permission_type  allow | deny (default: allow)
#   provider_type    local | file | ads | ldap | nis (default: local) -
#                    only used when adding a new entry
#   access_zone      (default: System)
#   apply_to_target  true | false (default: false) - if true, resolves
#                    the share's underlying path, checks whether that
#                    path is covered by a REAL SyncIQ policy on the
#                    source cluster (the live cluster is the source of
#                    truth, not shares.yml's declared replication), and
#                    if so, applies the same permission add/remove to a
#                    share of the SAME NAME on the replication target
#                    too (assumes DR parity in share naming - SyncIQ
#                    itself does not replicate share configuration). If
#                    no policy covers it, or the target has no share by
#                    that name, this is reported and the run falls back
#                    to source-only. If the target-side change fails,
#                    BOTH source and target are rolled back to avoid
#                    drift.
#
# Example - grant a domain group write access:
#   ansible-playbook playbooks/manage_smb_permission.yml \
#     -e target_site=site_a \
#     -e share_name=finance_data \
#     -e trustee_type=group \
#     -e 'trustee_name="INWI\\finance_team"' \
#     -e permission=write \
#     -e state=present
#
# Example - revoke it again:
#   ansible-playbook playbooks/manage_smb_permission.yml \
#     -e target_site=site_a \
#     -e share_name=finance_data \
#     -e trustee_type=group \
#     -e 'trustee_name="INWI\\finance_team"' \
#     -e permission=write \
#     -e state=absent
#
# Example - AWX Survey / extra_vars JSON (same operation as the first):
#   {
#     "target_site": "site_a",
#     "share_name": "finance_data",
#     "trustee_type": "group",
#     "trustee_name": "INWI\\finance_team",
#     "permission": "write",
#     "state": "present"
#   }

- name: Add/remove an SMB permission entry on an existing share
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/sites.yml

  pre_tasks:
    - name: Overlay AWX-injected site credentials, if present
      ansible.builtin.import_role:
        name: awx_credential_overlay

    - name: Assert required extra_vars are present and valid
      ansible.builtin.assert:
        that:
          - target_site is defined
          - target_site in sites
          - share_name is defined
          - share_name | length > 0
          - trustee_type is defined
          - trustee_type in ['user', 'group', 'wellknown']
          - trustee_name is defined
          - trustee_name | length > 0
          - permission is defined
          - permission in ['read', 'write', 'full']
          - state is defined
          - state in ['present', 'absent']
        fail_msg: >-
          Required: target_site (one of {{ sites.keys() | join(', ') }}),
          share_name, trustee_type (user|group|wellknown), trustee_name,
          permission (read|write|full), state (present|absent).

    - name: Resolve working variables
      ansible.builtin.set_fact:
        site: "{{ sites[target_site] }}"
        permission_type: "{{ permission_type | default('allow') }}"
        provider_type: "{{ provider_type | default('local') }}"
        access_zone: "{{ access_zone | default('System') }}"

    - name: Validate permission_type
      ansible.builtin.assert:
        that:
          - permission_type in ['allow', 'deny']
        fail_msg: "permission_type must be one of: allow, deny"

    - name: Fail fast if the target site still has CHANGE_ME / missing fields
      ansible.builtin.assert:
        that:
          - site.onefs_host is defined
          - site.onefs_host | length > 0
          - site.onefs_host != "CHANGE_ME"
          - site.api_user is defined
          - site.api_user | length > 0
          - site.api_password is defined
          - site.api_password | length > 0
          - site.api_password != "CHANGE_ME"
        fail_msg: >-
          Site '{{ target_site }}' is missing required connection fields or
          still has a CHANGE_ME placeholder - check sites.yml / the
          attached AWX Credential.
      no_log: true

  tasks:
    - name: Capture the share's current permissions (for rollback + diffing)
      # NOTE: unlike nfs/smartquota, this module does NOT support
      # check_mode (confirmed in its docs) - so this call deliberately
      # omits `path` and `permissions` (path is "mandatory only for the
      # create operation" per the module docs), which should make any
      # attempted creation of a non-existent share fail cleanly rather
      # than silently succeed as a side effect of "just checking".
      dellemc.powerscale.smb:
        onefs_host: "{{ site.onefs_host }}"
        port_no: "{{ site.port_no | default(8080) }}"
        verify_ssl: "{{ site.verify_ssl | default(false) }}"
        api_user: "{{ site.api_user }}"
        api_password: "{{ site.api_password }}"
        share_name: "{{ share_name }}"
        access_zone: "{{ access_zone }}"
        state: "present"
      register: smb_before
      ignore_errors: true
      no_log: true

    - name: Fail fast if the share doesn't exist (or another error occurred)
      ansible.builtin.fail:
        msg: >-
          Could not read SMB share '{{ share_name }}' on {{ site.onefs_host }} -
          it may not exist (this playbook only edits an EXISTING share's
          permissions, it does not create new shares - use
          provision_share.yml for that), or another error occurred:
          {{ smb_before.msg | default('see task output above') }}
      when: smb_before is failed or smb_before.smb_details.shares is not defined or smb_before.smb_details.shares | length == 0

    # The module's GET returns entries as {permission, permission_type,
    # trustee: {id, name, type}}. That same shape is what the OneFS REST
    # API's PUT accepts, so we keep it as-is (trustee id included - no name
    # re-resolution needed, works for ads/ldap/local alike).
    # NOTE: OneFS stores "write" as "change" - the module translates on
    # input, but GET returns "change", so all comparisons use _perm_api.
    - name: Reset permissions accumulator (loops accumulate across runs otherwise - see smb.yml's known bug this project already fixed once)
      ansible.builtin.set_fact:
        _current_permissions: []
        _perm_api: "{{ 'change' if permission == 'write' else permission }}"

    - name: Capture current permissions in REST API shape (used for revoke + rollback)
      ansible.builtin.set_fact:
        _current_permissions: >-
          {{ _current_permissions + [{
               'permission': perm_item.permission,
               'permission_type': perm_item.permission_type,
               'trustee': {'id': perm_item.trustee.id, 'name': perm_item.trustee.name, 'type': perm_item.trustee.type}
             }] }}
      loop: "{{ smb_before.smb_details.shares[0].permissions | default([]) }}"
      loop_control:
        loop_var: perm_item
        label: "{{ perm_item.trustee.name }}"

    - name: "[{{ share_name }}] Current permissions (before)"
      ansible.builtin.debug:
        msg: "{{ _current_permissions | map(attribute='trustee.name') | zip(_current_permissions | map(attribute='trustee.type'), _current_permissions | map(attribute='permission_type'), _current_permissions | map(attribute='permission')) | map('join', ' ') | list }}"

    # Trustee name compared case-insensitively (OneFS returns "Everyone",
    # operators type "everyone"). Matching is on the exact entry:
    # trustee type + name + permission + permission_type.
    - name: Reset revoke list
      ansible.builtin.set_fact:
        _without_entry: []

    - name: Build the list with the target entry filtered out (order preserved - ACL order matters for deny/allow)
      ansible.builtin.set_fact:
        _without_entry: "{{ _without_entry + [perm_item] }}"
      loop: "{{ _current_permissions | default([]) }}"
      loop_control:
        loop_var: perm_item
        label: "{{ perm_item.trustee.name }}"
      when: >-
        not (perm_item.trustee.type == trustee_type
             and (perm_item.trustee.name | lower) == (trustee_name | lower)
             and perm_item.permission == _perm_api
             and perm_item.permission_type == permission_type)

    - name: Check whether the target entry already exists as specified
      ansible.builtin.set_fact:
        _entry_already_present: "{{ (_without_entry | length) < (_current_permissions | length) }}"

    - name: No change needed - report and skip
      ansible.builtin.debug:
        msg: >-
          {{ share_name }}: {{ trustee_name }} ({{ trustee_type }}, {{ permission }}/{{ permission_type }})
          is already {{ 'present' if state == 'present' else 'absent' }} - no change needed.
      when: (state == 'present' and (_entry_already_present | bool)) or (state == 'absent' and not (_entry_already_present | bool))

    - name: Resolve what to do on the source
      ansible.builtin.set_fact:
        _source_action: >-
          {{ 'add' if (state == 'present' and not (_entry_already_present | bool))
             else 'remove' if (state == 'absent' and (_entry_already_present | bool))
             else 'none' }}

    - name: Resolve apply_to_target
      ansible.builtin.set_fact:
        _apply_req: "{{ apply_to_target | default(false) | bool }}"

    - name: Check for a real replication target, if requested
      ansible.builtin.include_role:
        name: resolve_replication_target
      vars:
        source_path: "{{ smb_before.smb_details.shares[0].path }}"
      when: _apply_req | bool

    - name: Report replication discovery result
      ansible.builtin.debug:
        msg: >-
          {{ 'No SyncIQ policy covers ' ~ smb_before.smb_details.shares[0].path ~ ' on ' ~ site.onefs_host ~ ' - applying to source only.'
             if not (replication_found | default(false) | bool)
             else ('Replication target is ' ~ replication_target_site ~ ', but that site is not defined in sites.yml - applying to source only.'
                   if (replication_target_site | default('')) == ''
                   else 'Replication target resolved: ' ~ replication_target_site ~ ' (' ~ replication_target_path ~ ').') }}
      when: _apply_req | bool

    - name: Check whether a share of the same name exists on the target
      when: >-
        (_apply_req | bool) and (replication_found | default(false) | bool)
        and (replication_target_site | default('')) != ''
      block:
        - name: Resolve target site connection details
          ansible.builtin.set_fact:
            target_site_obj: "{{ sites[replication_target_site] }}"

        - name: Check whether the target share exists (read-only)
          dellemc.powerscale.smb:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            share_name: "{{ share_name }}"
            access_zone: "{{ access_zone }}"
            state: "present"
          register: smb_target_before
          ignore_errors: true
          no_log: true

        - name: Report if the target share is missing
          ansible.builtin.debug:
            msg: >-
              No SMB share named '{{ share_name }}' found on
              {{ target_site_obj.onefs_host }} (the replication target) -
              applying to source only.
          when: >-
            smb_target_before is failed or smb_target_before.smb_details.shares is not defined
            or smb_target_before.smb_details.shares | length == 0

        - name: Reset target permissions accumulator
          ansible.builtin.set_fact:
            _current_target_permissions: []
          when: smb_target_before is succeeded and smb_target_before.smb_details.shares | default([]) | length > 0

        - name: Capture target's current permissions in REST API shape
          ansible.builtin.set_fact:
            _current_target_permissions: >-
              {{ _current_target_permissions + [{
                   'permission': perm_item.permission,
                   'permission_type': perm_item.permission_type,
                   'trustee': {'id': perm_item.trustee.id, 'name': perm_item.trustee.name, 'type': perm_item.trustee.type}
                 }] }}
          loop: "{{ smb_target_before.smb_details.shares[0].permissions | default([]) }}"
          loop_control:
            loop_var: perm_item
            label: "{{ perm_item.trustee.name }}"
          when: smb_target_before is succeeded and smb_target_before.smb_details.shares | default([]) | length > 0

    - name: Resolve whether we'll actually touch the target this run
      ansible.builtin.set_fact:
        _apply_to_target_effective: >-
          {{ (_apply_req | bool) and (replication_found | default(false) | bool)
             and (replication_target_site | default('')) != ''
             and (smb_target_before is defined) and (smb_target_before is not failed) and (smb_target_before is not skipped)
             and (smb_target_before.smb_details.shares | default([]) | length > 0) }}

    - name: Reset target revoke list
      ansible.builtin.set_fact:
        _target_without_entry: []
      when: _apply_to_target_effective | bool

    - name: Build the target list with the target entry filtered out (order preserved)
      ansible.builtin.set_fact:
        _target_without_entry: "{{ _target_without_entry + [perm_item] }}"
      loop: "{{ _current_target_permissions | default([]) }}"
      loop_control:
        loop_var: perm_item
        label: "{{ perm_item.trustee.name }}"
      when: >-
        (_apply_to_target_effective | bool) and
        not (perm_item.trustee.type == trustee_type
             and (perm_item.trustee.name | lower) == (trustee_name | lower)
             and perm_item.permission == _perm_api
             and perm_item.permission_type == permission_type)

    - name: Check whether the target already has this entry as specified
      ansible.builtin.set_fact:
        _target_entry_already_present: "{{ (_target_without_entry | length) < (_current_target_permissions | length) }}"
      when: _apply_to_target_effective | bool

    - name: Target already matches desired state - report and skip target change
      ansible.builtin.debug:
        msg: >-
          {{ replication_target_path | default(share_name) }} ({{ target_site_obj.onefs_host | default('') }}):
          {{ trustee_name }} is already {{ 'present' if state == 'present' else 'absent' }} - no target change needed.
      when: >-
        (_apply_to_target_effective | bool) and
        ((state == 'present' and (_target_entry_already_present | bool)) or (state == 'absent' and not (_target_entry_already_present | bool)))

    - name: Resolve what to do on the target
      ansible.builtin.set_fact:
        _target_action: >-
          {{ 'none' if not (_apply_to_target_effective | bool)
             else 'add' if (state == 'present' and not (_target_entry_already_present | bool))
             else 'remove' if (state == 'absent' and (_target_entry_already_present | bool))
             else 'none' }}

    # OneFS REST auth: session, not HTTP basic. Basic auth to PAPI is
    # disabled by default on recent OneFS (401 "Unauthorized to access
    # PAPI") - the dellemc SDK itself logs in via /session/1/session and
    # sends the isisessid cookie + X-CSRF-Token + Origin on every call, so
    # the REST writes below do the same. Only logged in when a write is due.
    - name: "[source] Open OneFS API session (for REST revoke/rollback)"
      ansible.builtin.uri:
        url: "https://{{ site.onefs_host }}:{{ site.port_no | default(8080) }}/session/1/session"
        method: POST
        validate_certs: "{{ site.verify_ssl | default(false) }}"
        body_format: json
        body:
          username: "{{ site.api_user }}"
          password: "{{ site.api_password }}"
          services: ["platform"]
        status_code: [200, 201]
      register: _src_session
      no_log: true
      when: _source_action != 'none'

    - name: "[target] Open OneFS API session (for REST revoke/rollback)"
      ansible.builtin.uri:
        url: "https://{{ target_site_obj.onefs_host }}:{{ target_site_obj.port_no | default(8080) }}/session/1/session"
        method: POST
        validate_certs: "{{ target_site_obj.verify_ssl | default(false) }}"
        body_format: json
        body:
          username: "{{ target_site_obj.api_user }}"
          password: "{{ target_site_obj.api_password }}"
          services: ["platform"]
        status_code: [200, 201]
      register: _tgt_session
      no_log: true
      when: _target_action != 'none'

    # Write paths:
    #   add    -> dellemc.powerscale.smb with ONLY the new entry. The module
    #             MERGES the given list into the share's existing entries
    #             (make_permissions() keeps every trustee not in the list),
    #             so passing just the new entry adds it without re-resolving
    #             any existing trustee by name.
    #   remove -> OneFS REST API PUT of the full remaining list. The module
    #             cannot revoke: because of that same merge, an entry left
    #             out of `permissions` is silently kept (confirmed in the
    #             3.10.0 module source and on a live cluster). PUT on
    #             /platform/1/protocols/smb/shares/<name> REPLACES the list.
    #   rollback -> REST PUT of the original list, for the same reason (a
    #             module-based rollback could never undo an add).
    - block:
        - name: "[{{ share_name }}] (source) Add {{ trustee_name }}"
          dellemc.powerscale.smb:
            onefs_host: "{{ site.onefs_host }}"
            port_no: "{{ site.port_no | default(8080) }}"
            verify_ssl: "{{ site.verify_ssl | default(false) }}"
            api_user: "{{ site.api_user }}"
            api_password: "{{ site.api_password }}"
            share_name: "{{ share_name }}"
            access_zone: "{{ access_zone }}"
            permissions:
              - "{{ ({'user_name': trustee_name} if trustee_type == 'user'
                     else {'group_name': trustee_name} if trustee_type == 'group'
                     else {'wellknown': trustee_name})
                    | combine({'permission': permission, 'permission_type': permission_type, 'provider_type': provider_type}) }}"
            state: "present"
          register: smb_add
          no_log: true
          when: _source_action == 'add'

        - name: "[{{ share_name }}] (source) Remove {{ trustee_name }}"
          ansible.builtin.uri:
            url: "https://{{ site.onefs_host }}:{{ site.port_no | default(8080) }}/platform/1/protocols/smb/shares/{{ share_name | urlencode }}?zone={{ access_zone | urlencode }}"
            method: PUT
            headers:
              Cookie: "isisessid={{ _src_session.cookies.isisessid }}"
              X-CSRF-Token: "{{ _src_session.cookies.isicsrf }}"
              Origin: "https://{{ site.onefs_host }}:{{ site.port_no | default(8080) }}"
            validate_certs: "{{ site.verify_ssl | default(false) }}"
            body_format: json
            body:
              permissions: "{{ _without_entry }}"
            status_code: [200, 204]
          register: smb_remove
          changed_when: true
          no_log: true
          when: _source_action == 'remove'

        - name: "[{{ share_name }}] Source result"
          ansible.builtin.debug:
            msg: >-
              {{ trustee_name }} {{ 'added to' if _source_action == 'add' else 'removed from' }}
              {{ share_name }}'s permissions -
              {{ 'changed' if (smb_add is changed or smb_remove is changed) else 'already in desired state, no change' }}.
          when: _source_action != 'none'

        - name: "[{{ share_name }}] (target) Add {{ trustee_name }}"
          dellemc.powerscale.smb:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            share_name: "{{ share_name }}"
            access_zone: "{{ access_zone }}"
            permissions:
              - "{{ ({'user_name': trustee_name} if trustee_type == 'user'
                     else {'group_name': trustee_name} if trustee_type == 'group'
                     else {'wellknown': trustee_name})
                    | combine({'permission': permission, 'permission_type': permission_type, 'provider_type': provider_type}) }}"
            state: "present"
          register: smb_target_add
          no_log: true
          when: _target_action == 'add'

        - name: "[{{ share_name }}] (target) Remove {{ trustee_name }}"
          ansible.builtin.uri:
            url: "https://{{ target_site_obj.onefs_host }}:{{ target_site_obj.port_no | default(8080) }}/platform/1/protocols/smb/shares/{{ share_name | urlencode }}?zone={{ access_zone | urlencode }}"
            method: PUT
            headers:
              Cookie: "isisessid={{ _tgt_session.cookies.isisessid }}"
              X-CSRF-Token: "{{ _tgt_session.cookies.isicsrf }}"
              Origin: "https://{{ target_site_obj.onefs_host }}:{{ target_site_obj.port_no | default(8080) }}"
            validate_certs: "{{ target_site_obj.verify_ssl | default(false) }}"
            body_format: json
            body:
              permissions: "{{ _target_without_entry }}"
            status_code: [200, 204]
          register: smb_target_remove
          changed_when: true
          no_log: true
          when: _target_action == 'remove'

        - name: "[{{ share_name }}] Target result"
          ansible.builtin.debug:
            msg: >-
              {{ trustee_name }} {{ 'added to' if _target_action == 'add' else 'removed from' }}
              {{ share_name }}'s permissions on {{ target_site_obj.onefs_host }} -
              {{ 'changed' if (smb_target_add is changed or smb_target_remove is changed) else 'already in desired state, no change' }}.
          when: _target_action != 'none'

      rescue:
        - name: "ROLLBACK [{{ share_name }}] (source) - restore original permission list"
          ansible.builtin.uri:
            url: "https://{{ site.onefs_host }}:{{ site.port_no | default(8080) }}/platform/1/protocols/smb/shares/{{ share_name | urlencode }}?zone={{ access_zone | urlencode }}"
            method: PUT
            headers:
              Cookie: "isisessid={{ _src_session.cookies.isisessid }}"
              X-CSRF-Token: "{{ _src_session.cookies.isicsrf }}"
              Origin: "https://{{ site.onefs_host }}:{{ site.port_no | default(8080) }}"
            validate_certs: "{{ site.verify_ssl | default(false) }}"
            body_format: json
            body:
              permissions: "{{ _current_permissions }}"
            status_code: [200, 204]
          register: rollback_source_result
          ignore_errors: true
          no_log: true
          when: _source_action != 'none'

        - name: "ROLLBACK [{{ share_name }}] (target) - restore original permission list"
          ansible.builtin.uri:
            url: "https://{{ target_site_obj.onefs_host }}:{{ target_site_obj.port_no | default(8080) }}/platform/1/protocols/smb/shares/{{ share_name | urlencode }}?zone={{ access_zone | urlencode }}"
            method: PUT
            headers:
              Cookie: "isisessid={{ _tgt_session.cookies.isisessid }}"
              X-CSRF-Token: "{{ _tgt_session.cookies.isicsrf }}"
              Origin: "https://{{ target_site_obj.onefs_host }}:{{ target_site_obj.port_no | default(8080) }}"
            validate_certs: "{{ target_site_obj.verify_ssl | default(false) }}"
            body_format: json
            body:
              permissions: "{{ _current_target_permissions }}"
            status_code: [200, 204]
          register: rollback_target_result
          ignore_errors: true
          no_log: true
          when: _target_action != 'none'

        - name: Fail the play - report rollback outcome
          ansible.builtin.fail:
            msg: >-
              The permission change on {{ share_name }} failed. Source rollback
              {{ 'succeeded' if not (rollback_source_result.failed | default(false))
                 else 'ALSO FAILED - manual verification/intervention needed' }}.
              {{ ('Target rollback ' ~ ('succeeded' if not (rollback_target_result.failed | default(false)) else 'ALSO FAILED - manual verification/intervention needed') ~ '.')
                 if _target_action != 'none' else '' }}
      always:
        - name: Close OneFS API sessions
          ansible.builtin.uri:
            url: "https://{{ item.host }}:{{ item.port }}/session/1/session"
            method: DELETE
            validate_certs: false
            headers:
              Cookie: "isisessid={{ item.sess.cookies.isisessid }}"
              X-CSRF-Token: "{{ item.sess.cookies.isicsrf }}"
              Origin: "https://{{ item.host }}:{{ item.port }}"
            status_code: [200, 204, 401]
          loop: >-
            {{ ([{'host': site.onefs_host, 'port': site.port_no | default(8080), 'sess': _src_session}]
                if (_src_session.cookies is defined) else [])
               + ([{'host': target_site_obj.onefs_host, 'port': target_site_obj.port_no | default(8080), 'sess': _tgt_session}]
                  if (_tgt_session.cookies is defined) else []) }}
          loop_control:
            label: "{{ item.host }}"
          ignore_errors: true
          no_log: true
      when: _source_action != 'none' or _target_action != 'none'
