---
# Set up (or tear down) a full DR relationship for one share, fully ad-hoc
# via extra_vars/Survey - no shares.yml editing needed:
#   1. Ensures the NFS export (and, if smb_share_name is given, the SMB
#      share; and, if quota_gb is given, the quota) exist on the TARGET
#      with the same clients/permissions/size as the source - but only
#      CREATES them if missing. If the target already has its own
#      export/share/quota at that path, this playbook leaves it alone
#      rather than overwriting it - deliberate, conservative default.
#   2. Creates a real SyncIQ replication policy from source to target.
#
# INPUTS: every variable below can come from its Survey field, from the
# optional "Input (JSON)" field (input_json - one JSON object; a key there
# wins over the same Survey field), or from extra_vars. They are read as
# inp.<name> (roles/input_resolver). The outcome is printed as a short
# RESULT block at the end and saved to job artifacts (roles/run_result).
#
# Verified against the real installed dellemc.powerscale 3.10.0 collection
# (ansible-doc dellemc.powerscale.synciqpolicy) before writing this:
#   - target_cluster.password is the SyncIQ TARGET password - it must
#     match the password set on the target cluster with
#     `isi sync settings modify --password`, and must NOT be sent when the
#     target has none (the job then fails with "Authentication with target
#     failed" - found on a live cluster). It is NOT the API/root password,
#     so it comes from the optional per-site synciq_password (AWX
#     credential field "SyncIQ Target Password", or sites.yml).
#   - if the target requires encrypted SyncIQ (isi sync settings view ->
#     Encryption Required), SyncIQ certificates are needed - not handled
#     here yet.
#   - source_cluster (and its nested source_network) is OPTIONAL - a
#     policy can be created with no network pool/subnet restriction at
#     all, which is why network_pool/network_subnet below are optional
#     and auto-detected/skipped rather than required.
#   - policy_name is required for CREATION specifically (not globally
#     required - conditionally required, easy to miss in the docs).
#   - the schedule field name is `run_job` (choices: on-schedule,
#     when-source-modified, when-snapshot-taken, manual) despite the
#     `schedule` field's own doc text referring to "run_policy" - a typo
#     in the module's own docs, confirmed by checking the real field list.
#
# Rollback scope (deliberately limited, per design decision): if anything
# fails AFTER the SyncIQ policy is created this run, the policy is deleted
# (state: absent). Newly-created target export/share/quota objects are
# NOT automatically deleted on failure - those are idempotent-safe to
# leave in place and retry, unlike a policy that could already be moving
# data. Not yet live-tested against a running cluster.
#
# Required extra_vars:
#   source_site   site_a | site_b - the replication SOURCE
#   target_site   site_a | site_b - the replication TARGET (must differ
#                 from source_site)
#   share_path and/or smb_share_name - at least one is required:
#     NFS only : share_path      e.g. "/ifs/data/finance" - an EXISTING
#                                NFS export on the source
#     SMB only : smb_share_name  an EXISTING SMB share on the source; its
#                                path is used as share_path
#     mixed    : both - the SMB share's path must equal share_path
#   (this playbook mirrors an existing share's DR setup, it does not
#   create brand-new shares from scratch - use provision_share.yml for
#   that). SyncIQ replicates the directory either way; the protocol
#   objects found on the source decide what gets mirrored on the target.
# Optional:
#   dry_run           true (default) = read both clusters and print the plan,
#                     create nothing; false = apply
#   smb_share_name    (see above) mirrors this SMB share (by name) and
#                     its permissions to the target
#   quota_gb          if set, also ensures a matching quota (this size)
#                     exists on the target
#   target_path       path on the target cluster (default: same as
#                     share_path)
#   policy_name       (default: "<last path component>_replication")
#   schedule          isidate format, e.g. "every 4 hours" - if omitted,
#                     the policy is created with run_job=manual instead
#                     of on-schedule (you trigger syncs yourself)
#   action            sync | copy (default: sync)
#   network_pool      SyncIQ source network pool (auto-detected if
#   network_subnet    omitted and the source cluster has exactly one
#                     pool configured; skipped entirely - no network
#                     restriction - if zero or more than one exist)
#   rpo_alert_minutes positive integer, optional
#   state             present | absent (default: present). absent removes
#                     ONLY the SyncIQ policy - it does not delete the
#                     mirrored target export/share/quota, since those may
#                     have independent value beyond just this policy.
#
# Example - set up DR for an NFS-only share, auto-detected network:
#   ansible-playbook playbooks/setup_share_replication.yml \
#     -e source_site=site_a \
#     -e target_site=site_b \
#     -e share_path=/ifs/data/finance \
#     -e schedule="every 4 hours"
#
# Example - SMB-only share (path taken from the share):
#   ansible-playbook playbooks/setup_share_replication.yml \
#     -e source_site=site_a \
#     -e target_site=site_b \
#     -e smb_share_name=hr_docs
#
# Example - mixed: also mirror the SMB share and a quota:
#   ansible-playbook playbooks/setup_share_replication.yml \
#     -e source_site=site_a \
#     -e target_site=site_b \
#     -e share_path=/ifs/data/finance \
#     -e smb_share_name=finance_data \
#     -e quota_gb=500 \
#     -e schedule="every 4 hours"
#
# Example - AWX Survey / extra_vars JSON (first example):
#   {
#     "source_site": "site_a",
#     "target_site": "site_b",
#     "share_path": "/ifs/data/finance",
#     "schedule": "every 4 hours"
#   }

- name: Set up (or tear down) DR replication for one share
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/sites.yml

  pre_tasks:
    - name: Overlay AWX-injected site credentials, if present
      ansible.builtin.import_role:
        name: awx_credential_overlay

    # Inputs come from the Survey fields and/or the "Input (JSON)" field
    # (JSON wins) - every input below is read as inp.<name>.
    - name: Resolve inputs (Survey fields and/or Input (JSON))
      ansible.builtin.import_role:
        name: input_resolver
      vars:
        input_keys: ['source_site', 'target_site', 'share_path', 'smb_share_name', 'quota_gb', 'target_path', 'policy_name', 'schedule', 'action', 'network_pool', 'network_subnet', 'rpo_alert_minutes', 'state', 'access_zone', 'dry_run']

    - name: Assert required extra_vars are present and valid
      ansible.builtin.assert:
        that:
          - inp.source_site is defined
          - inp.source_site in sites
          - inp.target_site is defined
          - inp.target_site in sites
          - inp.source_site != inp.target_site
          - (inp.share_path | default('') | length > 0) or (inp.smb_share_name | default('') | length > 0)
        fail_msg: >-
          Required: source_site and target_site (one of
          {{ sites.keys() | join(', ') }}, and different from each other),
          plus share_path (NFS / mixed) and/or smb_share_name (SMB / mixed).

    - name: Resolve working variables
      ansible.builtin.set_fact:
        source_site_obj: "{{ sites[inp.source_site] }}"
        target_site_obj: "{{ sites[inp.target_site] }}"
        # Internal, normalised copies of the optional inputs. Empty strings /
        # 0 mean "not given" (AWX can send blank answers, and
        # provision_share.yml passes "" for unused DR fields). Separate
        # _names because set_fact cannot override a value passed as an
        # extra var. Text answers are trimmed - a stray space typed into a
        # Survey field otherwise breaks paths ("Path must start with '/'").
        _action: "{{ inp.action | default('sync', true) | string | trim }}"
        _state: "{{ inp.state | default('present', true) | string | trim }}"
        _dry: "{{ inp.dry_run | default(true) | bool }}"
        _smb_name: "{{ inp.smb_share_name | default('') | string | trim }}"
        _schedule: "{{ inp.schedule | default('') | string | trim }}"
        _smb_given: "{{ inp.smb_share_name | default('') | string | trim | length > 0 }}"
        _quota_given: "{{ (inp.quota_gb | default(0, true) | int) > 0 }}"
        _schedule_given: "{{ inp.schedule | default('') | string | trim | length > 0 }}"
        _rpo_given: "{{ inp.rpo_alert_minutes | default('') | string | trim | length > 0 }}"
      no_log: true

    - name: Validate action/state
      ansible.builtin.assert:
        that:
          - _action in ['sync', 'copy']
          - _state in ['present', 'absent']
        fail_msg: "action must be sync|copy, state must be present|absent."

    - name: Fail fast if either site still has CHANGE_ME / missing fields
      ansible.builtin.assert:
        that:
          - source_site_obj.onefs_host is defined
          - source_site_obj.onefs_host | length > 0
          - source_site_obj.onefs_host != "CHANGE_ME"
          - source_site_obj.api_password is defined
          - source_site_obj.api_password != "CHANGE_ME"
          - target_site_obj.onefs_host is defined
          - target_site_obj.onefs_host | length > 0
          - target_site_obj.onefs_host != "CHANGE_ME"
          - target_site_obj.api_password is defined
          - target_site_obj.api_password != "CHANGE_ME"
        fail_msg: >-
          source_site or target_site is missing required connection
          fields or still has a CHANGE_ME placeholder - check sites.yml /
          the attached AWX Credentials.
      no_log: true

  tasks:
    # ---- 1. Read the source's current state ----
    # SMB first: for an SMB-only share, share_path comes from the share.
    - name: "[source] Capture current SMB share '{{ _smb_name }}'"
      dellemc.powerscale.smb:
        onefs_host: "{{ source_site_obj.onefs_host }}"
        port_no: "{{ source_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ source_site_obj.api_user }}"
        api_password: "{{ source_site_obj.api_password }}"
        share_name: "{{ _smb_name }}"
        state: "present"
      register: source_smb
      # existence probe: 'not found' is a normal answer - read from the result, don't show it as an error
      failed_when: false
      when: (_smb_given | bool)

    - name: Fail fast if smb_share_name was given but doesn't exist on source
      ansible.builtin.fail:
        msg: >-
          smb_share_name='{{ _smb_name }}' was given but no such SMB
          share exists on {{ source_site_obj.onefs_host }}.
      when: >-
        (_smb_given | bool) and
        (source_smb is failed or source_smb.smb_details.shares | default([]) | length == 0)

    - name: Resolve share_path (from the SMB share when not given - SMB-only)
      ansible.builtin.set_fact:
        _share_path: >-
          {{ ((inp.share_path | string | trim)
              if (inp.share_path | default('') | string | trim | length > 0)
              else source_smb.smb_details.shares[0].path) | regex_replace('/+$', '') }}

    - name: Fail fast if share_path and the SMB share's path disagree (mixed)
      ansible.builtin.fail:
        msg: >-
          share_path '{{ _share_path }}' does not match SMB share
          '{{ _smb_name }}' path '{{ source_smb.smb_details.shares[0].path }}'
          on {{ source_site_obj.onefs_host }} - for a mixed share both must
          point at the same directory.
      when: >-
        (_smb_given | bool) and
        (_share_path | regex_replace('/+$', '')) != (source_smb.smb_details.shares[0].path | regex_replace('/+$', ''))

    - name: Resolve target_path and policy_name
      ansible.builtin.set_fact:
        _target_path: "{{ (inp.target_path | default('') | string | trim) or _share_path }}"
        _policy_name: "{{ (inp.policy_name | default('') | string | trim) or ((_share_path | regex_replace('/+$', '')).split('/') | last ~ '_replication') }}"

    - name: Validate the source and target paths
      ansible.builtin.assert:
        that:
          - _share_path is match('^/ifs/')
          - _target_path is match('^/ifs/')
        fail_msg: >-
          Paths must start with /ifs/ - got share path '{{ _share_path }}',
          target path '{{ _target_path }}'.

    - name: "[source] Capture current NFS export at {{ _share_path }}"
      dellemc.powerscale.nfs:
        onefs_host: "{{ source_site_obj.onefs_host }}"
        port_no: "{{ source_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ source_site_obj.api_user }}"
        api_password: "{{ source_site_obj.api_password }}"
        path: "{{ _share_path }}"
        state: "present"
      check_mode: true
      register: source_nfs

    # The dellemc.powerscale modules ALWAYS return their *_details key -
    # {} (nfs, synciqpolicy) or None (smartquota) when nothing exists - so
    # 'is defined' is always true. Test for emptiness instead.
    - name: Resolve which protocols the source share has
      ansible.builtin.set_fact:
        _source_has_nfs: "{{ source_nfs.NFS_export_details | default({}, true) | length > 0 }}"
        _source_has_smb: "{{ (_smb_given | bool) }}"

    - name: Fail fast if there's nothing to replicate at this path
      ansible.builtin.fail:
        msg: >-
          No NFS export found at '{{ _share_path }}' on
          {{ source_site_obj.onefs_host }} and no smb_share_name given
          (this playbook mirrors an EXISTING share's DR setup, it does not
          create brand-new shares - use provision_share.yml for that). For
          an SMB-only share, pass smb_share_name.
      when: not (_source_has_nfs | bool) and not (_source_has_smb | bool)

    - name: "[source] Protocols to mirror"
      ansible.builtin.debug:
        msg: >-
          {{ _share_path }}: {{ 'mixed NFS + SMB' if (_source_has_nfs | bool and _source_has_smb | bool)
             else 'NFS only' if (_source_has_nfs | bool) else 'SMB only' }}.

    - name: Convert source SMB permissions to module INPUT shape (for mirroring)
      ansible.builtin.set_fact:
        _mirror_permissions: >-
          {{ _mirror_permissions | default([]) + [
               ( {'user_name': perm_item.trustee.name} if perm_item.trustee.type == 'user'
                 else {'group_name': perm_item.trustee.name} if perm_item.trustee.type == 'group'
                 else {'wellknown': perm_item.trustee.name} )
               | combine({'permission': perm_item.permission, 'permission_type': perm_item.permission_type})
             ] }}
      loop: "{{ (source_smb.smb_details.shares[0].permissions | default([])) if (source_smb is defined and source_smb is not skipped and source_smb is not failed and source_smb.smb_details is defined) else [] }}"
      loop_control:
        loop_var: perm_item
        label: "{{ perm_item.trustee.name }}"

    - name: "[source] Capture current quota at {{ _share_path }}"
      dellemc.powerscale.smartquota:
        onefs_host: "{{ source_site_obj.onefs_host }}"
        port_no: "{{ source_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ source_site_obj.api_user }}"
        api_password: "{{ source_site_obj.api_password }}"
        path: "{{ _share_path }}"
        quota_type: "directory"
        state: "present"
      check_mode: true
      register: source_quota
      when: (_quota_given | bool)

    - name: Resolve access_zone from the source export
      ansible.builtin.set_fact:
        inp: "{{ inp | combine({'access_zone': source_nfs.NFS_export_details.zone | default(inp.access_zone | default('System'), true)}) }}"

    # ---- 2. Resolve the SyncIQ source network (optional) ----
    # Order: Survey / extra_vars, then the source site's credential (or
    # sites.yml) values, then auto-detection below. Empty or CHANGE_ME
    # values are ignored.
    - name: Resolve network_pool/network_subnet if both already given
      ansible.builtin.set_fact:
        _network_pool: >-
          {{ inp.network_pool | default('', true) | string
             or ((source_site_obj.network_pool | default('') | string) | regex_replace('^CHANGE_ME$', '')) }}
        _network_subnet: >-
          {{ inp.network_subnet | default('', true) | string
             or ((source_site_obj.network_subnet | default('') | string) | regex_replace('^CHANGE_ME$', '')) }}

    - name: Mark the network as resolved when both values are known
      ansible.builtin.set_fact:
        _network_resolved: "{{ (_network_pool | length > 0) and (_network_subnet | length > 0) }}"

    - name: Auto-detect the source cluster's network pools, if not given
      dellemc.powerscale.info:
        onefs_host: "{{ source_site_obj.onefs_host }}"
        port_no: "{{ source_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ source_site_obj.api_user }}"
        api_password: "{{ source_site_obj.api_password }}"
        gather_subset:
          - network_pools
      register: source_pools
      when: not (_network_resolved | bool)

    - name: Auto-select the pool if exactly one is configured
      ansible.builtin.set_fact:
        _network_pool: "{{ source_pools.NetworkPools[0].name }}"
        _network_subnet: "{{ source_pools.NetworkPools[0].id.split('.')[1] }}"
        _network_resolved: true
      when: >-
        not (_network_resolved | bool) and
        (source_pools.NetworkPools | default([]) | length == 1)

    - name: Report network pool resolution
      ansible.builtin.debug:
        msg: >-
          {{ 'Using network_pool=' ~ _network_pool ~ ', network_subnet=' ~ _network_subnet ~ '.'
             if (_network_resolved | bool)
             else 'No single network pool auto-detected on ' ~ source_site_obj.onefs_host ~
                  ' (' ~ (source_pools.NetworkPools | default([]) | length) ~ ' found) - ' ~
                  'creating the policy with no network restriction. Pass network_pool/network_subnet explicitly to set one.' }}

    # ---- 3. Check what already exists on the target ----
    - name: "[target] Check whether a matching NFS export already exists"
      dellemc.powerscale.nfs:
        onefs_host: "{{ target_site_obj.onefs_host }}"
        port_no: "{{ target_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ target_site_obj.api_user }}"
        api_password: "{{ target_site_obj.api_password }}"
        path: "{{ _target_path }}"
        access_zone: "{{ inp.access_zone }}"
        state: "present"
      check_mode: true
      register: target_nfs
      when: _source_has_nfs | bool

    - name: "[target] Check whether a matching SMB share already exists"
      dellemc.powerscale.smb:
        onefs_host: "{{ target_site_obj.onefs_host }}"
        port_no: "{{ target_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ target_site_obj.api_user }}"
        api_password: "{{ target_site_obj.api_password }}"
        share_name: "{{ _smb_name }}"
        state: "present"
      register: target_smb
      # existence probe: 'not found' is a normal answer - read from the result, don't show it as an error
      failed_when: false
      when: (_smb_given | bool)

    - name: "[target] Check whether a matching quota already exists"
      dellemc.powerscale.smartquota:
        onefs_host: "{{ target_site_obj.onefs_host }}"
        port_no: "{{ target_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ target_site_obj.api_user }}"
        api_password: "{{ target_site_obj.api_password }}"
        path: "{{ _target_path }}"
        quota_type: "directory"
        access_zone: "{{ inp.access_zone }}"
        state: "present"
      check_mode: true
      register: target_quota
      # A brand-new DR path doesn't exist yet: 'Path not found' means
      # 'no quota there yet', not an error. Anything else still fails.
      failed_when: >-
        (target_quota.failed | default(false)) and
        ('not found' not in (target_quota.msg | default('') | lower))
      when: (_quota_given | bool)

    - name: "[policy] Check whether this policy already exists"
      dellemc.powerscale.synciqpolicy:
        onefs_host: "{{ source_site_obj.onefs_host }}"
        port_no: "{{ source_site_obj.port_no | default(8080) }}"
        verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
        api_user: "{{ source_site_obj.api_user }}"
        api_password: "{{ source_site_obj.api_password }}"
        policy_name: "{{ _policy_name }}"
        state: "present"
      register: policy_before
      # existence probe: 'not found' is a normal answer - read from the result, don't show it as an error
      failed_when: false

    # ---- Plan (always printed; a dry run stops here) ----
    - name: Build the plan
      ansible.builtin.set_fact:
        _plan: >-
          {%- set p = policy_before is succeeded and (policy_before.synciq_policy_details | default({}, true) | length > 0) -%}
          {%- set t = target_site_obj.onefs_host ~ ':' ~ _target_path -%}
          {%- set ns = namespace(l=[]) -%}
          {%- if _state == 'present' -%}
            {%- set ns.l = ns.l + ['Target directory ' ~ t ~ ': ensure it exists'] -%}
            {%- if _source_has_nfs | bool -%}
              {%- set ns.l = ns.l + [('NFS export ' ~ t ~ ': CREATE (clients copied from source)')
                               if (target_nfs.NFS_export_details | default({}, true) | length == 0)
                               else ('NFS export ' ~ t ~ ': already exists - left as-is')] -%}
            {%- endif -%}
            {%- if _smb_given | bool -%}
              {%- set ns.l = ns.l + [("SMB share '" ~ _smb_name ~ "' on " ~ target_site_obj.onefs_host ~ ': CREATE (permissions copied from source)')
                               if (target_smb is failed or target_smb.smb_details.shares | default([]) | length == 0)
                               else ("SMB share '" ~ _smb_name ~ "' on " ~ target_site_obj.onefs_host ~ ': already exists - left as-is')] -%}
            {%- endif -%}
            {%- if _quota_given | bool -%}
              {%- set ns.l = ns.l + [('Quota ' ~ inp.quota_gb ~ 'GB on ' ~ t ~ ': CREATE')
                               if (target_quota.quota_details | default({}, true) | length == 0)
                               else ('Quota on ' ~ t ~ ': already exists - left as-is')] -%}
            {%- endif -%}
            {%- set ns.l = ns.l + [("SyncIQ policy '" ~ _policy_name ~ "': " ~ ('already exists - ensure settings' if p else 'CREATE')
                             ~ ' | ' ~ source_site_obj.onefs_host ~ ':' ~ _share_path ~ ' -> ' ~ t
                             ~ ' | action ' ~ _action
                             ~ ' | ' ~ (('schedule "' ~ _schedule ~ '"') if (_schedule_given | bool) else 'manual (no schedule)')
                             ~ ' | network ' ~ ((_network_pool ~ '/' ~ _network_subnet) if (_network_resolved | bool) else 'any'))] -%}
          {%- else -%}
            {%- set ns.l = ns.l + [("SyncIQ policy '" ~ _policy_name ~ "': " ~ ('DELETE' if p else 'does not exist - nothing to remove'))] -%}
          {%- endif -%}
          {{ ns.l | to_json }}

    - name: Plan
      ansible.builtin.debug:
        msg: "{{ [('DRY RUN - nothing will be changed. Set dry_run to false to apply.' if (_dry | bool) else 'LIVE RUN - applying:')] + (_plan | from_json) }}"

    - block:
        # ---- 4. Create missing target objects (never overwrite existing ones) ----
        # The nfs and smartquota modules cannot create a missing directory,
        # and on a fresh DR target the directory usually doesn't exist until
        # the first sync. Create it (owner root) so the export/quota below
        # can be made. SyncIQ accepts an existing target directory.
        - name: "[target] Ensure target directory {{ _target_path }} exists"
          dellemc.powerscale.filesystem:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ _target_path }}"
            access_zone: "{{ inp.access_zone }}"
            recursive: true
            owner:
              name: "root"
              provider_type: "file"
            state: "present"
          register: target_dir
          when: _state == 'present'

        - name: "[target] Create missing NFS export, mirroring source's clients"
          dellemc.powerscale.nfs:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ _target_path }}"
            access_zone: "{{ inp.access_zone }}"
            clients: "{{ source_nfs.NFS_export_details.clients | default([]) }}"
            read_only_clients: "{{ source_nfs.NFS_export_details.read_only_clients | default([]) }}"
            read_write_clients: "{{ source_nfs.NFS_export_details.read_write_clients | default([]) }}"
            root_clients: "{{ source_nfs.NFS_export_details.root_clients | default([]) }}"
            state: "present"
          register: target_nfs_created
          when: (_source_has_nfs | bool) and (target_nfs.NFS_export_details | default({}, true) | length == 0) and _state == 'present'

        - name: "[target] Report NFS export status"
          ansible.builtin.debug:
            msg: >-
              {{ 'Created a new NFS export at ' ~ _target_path ~ ' on ' ~ target_site_obj.onefs_host ~ ', mirroring source clients.'
                 if (target_nfs.NFS_export_details | default({}, true) | length == 0)
                 else 'Target already has an NFS export at ' ~ _target_path ~ ' - left as-is (not overwritten).' }}
          when: _state == 'present' and (_source_has_nfs | bool)

        - name: "[target] Create missing SMB share, mirroring source's permissions"
          dellemc.powerscale.smb:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            share_name: "{{ _smb_name }}"
            path: "{{ _target_path }}"
            access_zone: "{{ inp.access_zone }}"
            permissions: "{{ _mirror_permissions | default([]) }}"
            state: "present"
          register: target_smb_created
          when: >-
            (_smb_given | bool) and _state == 'present' and
            (target_smb is failed or target_smb.smb_details.shares | default([]) | length == 0)

        - name: "[target] Report SMB share status"
          ansible.builtin.debug:
            msg: >-
              {{ "Created a new SMB share '" ~ _smb_name ~ "' on " ~ target_site_obj.onefs_host ~ ', mirroring source permissions.'
                 if (target_smb is failed or target_smb.smb_details.shares | default([]) | length == 0)
                 else "Target already has an SMB share named '" ~ _smb_name ~ "' - left as-is (not overwritten)." }}
          when: (_smb_given | bool) and _state == 'present'

        - name: "[target] Create missing quota ({{ inp.quota_gb | default('') }}GB)"
          dellemc.powerscale.smartquota:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ _target_path }}"
            quota_type: "directory"
            access_zone: "{{ inp.access_zone }}"
            quota:
              hard_limit_size: "{{ inp.quota_gb }}"
              cap_unit: "GB"
            state: "present"
          register: target_quota_created
          when: (_quota_given | bool) and _state == 'present' and (target_quota.quota_details | default({}, true) | length == 0)

        - name: "[target] Report quota status"
          ansible.builtin.debug:
            msg: >-
              {{ 'Created a new ' ~ inp.quota_gb ~ 'GB quota at ' ~ _target_path ~ ' on ' ~ target_site_obj.onefs_host ~ '.'
                 if (target_quota.quota_details | default({}, true) | length == 0)
                 else 'Target already has a quota at ' ~ _target_path ~ ' - left as-is (not overwritten).' }}
          when: (_quota_given | bool) and _state == 'present'

        # ---- 5. Create/remove the SyncIQ policy itself ----
        - name: "[policy] {{ 'Create/ensure' if _state == 'present' else 'Delete' }} '{{ _policy_name }}'"
          dellemc.powerscale.synciqpolicy:
            onefs_host: "{{ source_site_obj.onefs_host }}"
            port_no: "{{ source_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ source_site_obj.api_user }}"
            api_password: "{{ source_site_obj.api_password }}"
            policy_name: "{{ _policy_name }}"
            action: "{{ _action }}"
            enabled: true
            source_cluster: >-
              {{ {'source_root_path': _share_path}
                 | combine({'source_network': {'pool': _network_pool, 'subnet': _network_subnet}} if (_network_resolved | bool) else {}) }}
            target_cluster: >-
              {{ {'target_host': target_site_obj.onefs_host, 'target_path': _target_path}
                 | combine({'password': target_site_obj.synciq_password}
                           if (target_site_obj.synciq_password | default('') | string | length > 0) else {}) }}
            run_job: "{{ 'on-schedule' if (_schedule_given | bool) else 'manual' }}"
            schedule: "{{ _schedule if (_schedule_given | bool) else omit }}"
            rpo_alert: "{{ (inp.rpo_alert_minutes | int) if (_rpo_given | bool) else omit }}"
            rpo_alert_unit: "{{ 'minutes' if (_rpo_given | bool) else omit }}"
            state: "{{ _state }}"
          register: policy_change

        - name: "[policy] Result"
          ansible.builtin.debug:
            msg: >-
              Policy '{{ _policy_name }}' ({{ _share_path }} -> {{ target_site_obj.onefs_host }}:{{ _target_path }}) -
              {{ 'changed' if policy_change.changed else 'already in desired state, no change' }}.

      rescue:
        - name: "ROLLBACK [policy] - delete the policy if we just created it"
          dellemc.powerscale.synciqpolicy:
            onefs_host: "{{ source_site_obj.onefs_host }}"
            port_no: "{{ source_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ source_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ source_site_obj.api_user }}"
            api_password: "{{ source_site_obj.api_password }}"
            policy_name: "{{ _policy_name }}"
            state: "absent"
          register: rollback_policy_result
          ignore_errors: true
          # only if the policy step actually ran (and the policy didn't exist before)
          when:
            - policy_change is defined
            - policy_change is not skipped
            - policy_before is failed or (policy_before.synciq_policy_details | default({}, true) | length == 0)

        - name: Fail the play - report what happened
          ansible.builtin.fail:
            msg: >-
              Setting up replication for {{ _share_path }} failed at
              "{{ ansible_failed_task.name | default('?') }}":
              {{ (ansible_failed_result.msg | default('see above')) | string | truncate(400) }}.
              {{ ('The SyncIQ policy was not created (the run stopped before that step).'
                  if (policy_change is not defined or policy_change is skipped)
                  else (("The SyncIQ policy step itself failed, so the policy was most likely not created - check with 'isi sync policies list' on "
                         ~ source_site_obj.onefs_host ~ '.')
                        if (policy_change is failed)
                  else ('The policy was newly created this run and has been deleted (rollback '
                        ~ ('succeeded' if not (rollback_policy_result.failed | default(false)) else 'ALSO FAILED - manual verification needed')
                        ~ ').'
                        if (policy_before is failed or (policy_before.synciq_policy_details | default({}, true) | length == 0))
                        else 'The policy already existed before this run and was left untouched.'))) }}
              Any target export/share/quota created earlier in this run were NOT
              automatically removed (idempotent-safe to leave in place) - check
              {{ target_site_obj.onefs_host }} manually if needed.
      when:
        - not (_dry | bool)
        - _state == 'present' or (policy_before is succeeded and (policy_before.synciq_policy_details | default({}, true) | length > 0))

    - name: Nothing to do - policy doesn't exist and state=absent
      ansible.builtin.debug:
        msg: "Policy '{{ _policy_name }}' does not exist - nothing to remove."
      when: not (_dry | bool) and _state == 'absent' and (policy_before is failed or (policy_before.synciq_policy_details | default({}, true) | length == 0))

    - name: RESULT
      ansible.builtin.include_role:
        name: run_result
      vars:
        result_title: "Setup Share Replication - {{ inp.source_site }}:{{ _share_path }} -> {{ inp.target_site }}:{{ _target_path }}"
        result_status: >-
          {{ 'DRY RUN' if (_dry | bool)
             else ('CHANGED' if ((target_dir.changed | default(false)) or (target_nfs_created.changed | default(false))
                                 or (target_smb_created.changed | default(false)) or (target_quota_created.changed | default(false))
                                 or (policy_change.changed | default(false)))
                   else 'NO CHANGE') }}
        result_lines: >-
          {{ (_plan | from_json)
             + ([] if (_dry | bool)
                else ["Policy '" ~ _policy_name ~ "': " ~ ('CHANGED' if (policy_change.changed | default(false)) else 'already in desired state')]) }}
