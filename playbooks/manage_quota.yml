---
# Edit the hard limit size of an EXISTING Smart Quota, fully ad-hoc via
# extra_vars/Survey - no shares.yml or sites.yml edits needed. Idempotent
# (no-op if the requested size already matches), with automatic rollback
# to the original size if anything fails after the change.
#
# Verified against the real installed dellemc.powerscale 3.10.0 collection
# (ansible-doc dellemc.powerscale.smartquota) before writing this - in
# particular:
#   - the actual module name is `smartquota`, NOT `quota` (that module
#     doesn't exist in this collection).
#   - the return value is `quota_details.thresholds.hard`, returned in
#     raw BYTES, not GB - this playbook converts both ways.
#   - check_mode is natively supported, used here for the "before" read.
#
# Required extra_vars:
#   target_site   site_a | site_b
#   quota_path    e.g. "/ifs/data/finance" - must have an EXISTING quota
#                 (this playbook only edits an existing quota's hard
#                 limit, it does not create new quotas - use
#                 provision_share.yml for that)
#   new_quota_gb  the new hard limit size, in GB
# Optional:
#   quota_type       user | group | directory | default-user | default-group |
#                    default-directory (default: directory)
#   access_zone      (default: System)
#   apply_to_target  true | false (default: false) - if true, checks
#                    whether quota_path is covered by a REAL SyncIQ policy
#                    on the source cluster (the live cluster is the source
#                    of truth, not shares.yml's declared replication), and
#                    if so, applies the same hard-limit resize to a
#                    matching quota on the replication target too. SyncIQ
#                    does not replicate quota configuration itself, so if
#                    the target doesn't already have its own quota at that
#                    path, this is reported and the run falls back to
#                    source-only - it never creates one there as a side
#                    effect. If the target-side change fails, BOTH source
#                    and target are rolled back to avoid drift.
#
# Example - resize an existing directory quota to 10GB:
#   ansible-playbook playbooks/manage_quota.yml \
#     -e target_site=site_a \
#     -e quota_path=/ifs/data/finance \
#     -e new_quota_gb=10
#
# Example - AWX Survey / extra_vars JSON (same operation):
#   {
#     "target_site": "site_a",
#     "quota_path": "/ifs/data/finance",
#     "new_quota_gb": 10
#   }

- name: Edit the hard limit of an existing Smart Quota
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/sites.yml

  pre_tasks:
    - name: Overlay AWX-injected site credentials, if present
      ansible.builtin.import_role:
        name: awx_credential_overlay

    - name: Assert required extra_vars are present and valid
      ansible.builtin.assert:
        that:
          - target_site is defined
          - target_site in sites
          - quota_path is defined
          - quota_path | length > 0
          - new_quota_gb is defined
          - new_quota_gb | int > 0
        fail_msg: >-
          Required: target_site (one of {{ sites.keys() | join(', ') }}),
          quota_path, new_quota_gb (positive integer, GB).

    - name: Resolve working variables
      ansible.builtin.set_fact:
        site: "{{ sites[target_site] }}"
        quota_type: "{{ quota_type | default('directory') }}"
        access_zone: "{{ access_zone | default('System') }}"

    - name: Validate quota_type
      ansible.builtin.assert:
        that:
          - quota_type in ['user', 'group', 'directory', 'default-user', 'default-group', 'default-directory']
        fail_msg: >-
          quota_type must be one of: user, group, directory, default-user,
          default-group, default-directory.

    - name: Fail fast if the target site still has CHANGE_ME / missing fields
      ansible.builtin.assert:
        that:
          - site.onefs_host is defined
          - site.onefs_host | length > 0
          - site.onefs_host != "CHANGE_ME"
          - site.api_user is defined
          - site.api_user | length > 0
          - site.api_password is defined
          - site.api_password | length > 0
          - site.api_password != "CHANGE_ME"
        fail_msg: >-
          Site '{{ target_site }}' is missing required connection fields or
          still has a CHANGE_ME placeholder - check sites.yml / the
          attached AWX Credential.
      no_log: true

  tasks:
    - name: Capture the quota's current state (for rollback + existence check)
      # check_mode: true here is deliberate and load-bearing - this module
      # explicitly documents check_mode support, and without it a plain
      # state=present call on a path with NO existing quota could create
      # one as a side effect of merely "checking".
      dellemc.powerscale.smartquota:
        onefs_host: "{{ site.onefs_host }}"
        port_no: "{{ site.port_no | default(8080) }}"
        verify_ssl: "{{ site.verify_ssl | default(false) }}"
        api_user: "{{ site.api_user }}"
        api_password: "{{ site.api_password }}"
        path: "{{ quota_path }}"
        quota_type: "{{ quota_type }}"
        access_zone: "{{ access_zone }}"
        state: "present"
      check_mode: true
      register: quota_before
      no_log: true

    - name: Fail fast if no quota exists yet at this path
      ansible.builtin.fail:
        msg: >-
          No existing {{ quota_type }} quota found at '{{ quota_path }}' on
          {{ site.onefs_host }} - this playbook only edits an EXISTING
          quota's hard limit, it does not create new quotas (use
          provision_share.yml for that).
      when: quota_before.quota_details is not defined

    - name: Resolve the original hard limit, in GB (bytes -> GB, for rollback)
      ansible.builtin.set_fact:
        _original_hard_limit_gb: >-
          {{ (quota_before.quota_details.thresholds.hard | default(0) | int) / (1024 ** 3) }}

    - name: "[{{ quota_path }}] Current hard limit (before)"
      ansible.builtin.debug:
        msg: "{{ _original_hard_limit_gb }} GB"

    - name: No change needed - report and skip
      ansible.builtin.debug:
        msg: >-
          {{ quota_path }}: hard limit is already {{ new_quota_gb }}GB - no change needed.
      when: (_original_hard_limit_gb | float | round(2)) == (new_quota_gb | int | round(2))

    - name: Resolve apply_to_target
      ansible.builtin.set_fact:
        apply_to_target: "{{ apply_to_target | default(false) | bool }}"
      when: (_original_hard_limit_gb | float | round(2)) != (new_quota_gb | int | round(2))

    - name: Check for a real replication target, if requested
      ansible.builtin.include_role:
        name: resolve_replication_target
      vars:
        source_path: "{{ quota_path }}"
      when: apply_to_target | default(false) and (_original_hard_limit_gb | float | round(2)) != (new_quota_gb | int | round(2))

    - name: Report replication discovery result
      ansible.builtin.debug:
        msg: >-
          {{ 'No SyncIQ policy covers ' ~ quota_path ~ ' on ' ~ site.onefs_host ~ ' - applying to source only.'
             if not (replication_found | default(false))
             else ('Replication target is ' ~ replication_target_site ~ ', but that site is not defined in sites.yml - applying to source only.'
                   if (replication_target_site | default('')) == ''
                   else 'Replication target resolved: ' ~ replication_target_site ~ ' (' ~ replication_target_path ~ ').') }}
      when: apply_to_target | default(false) and (_original_hard_limit_gb | float | round(2)) != (new_quota_gb | int | round(2))

    - name: Check whether the target quota actually exists
      when: >-
        (apply_to_target | default(false)) and (replication_found | default(false))
        and (replication_target_site | default('')) != ''
        and (_original_hard_limit_gb | float | round(2)) != (new_quota_gb | int | round(2))
      block:
        - name: Resolve target site connection details
          ansible.builtin.set_fact:
            target_site_obj: "{{ sites[replication_target_site] }}"

        - name: Check whether the target quota exists (read-only)
          dellemc.powerscale.smartquota:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            quota_type: "{{ quota_type }}"
            access_zone: "{{ access_zone }}"
            state: "present"
          check_mode: true
          register: quota_target_before
          no_log: true

        - name: Report if the target quota is missing
          ansible.builtin.debug:
            msg: >-
              No {{ quota_type }} quota found at {{ replication_target_path }}
              on {{ target_site_obj.onefs_host }} (the replication target) -
              applying to source only.
          when: quota_target_before.quota_details is not defined

        - name: Resolve the target's original hard limit, in GB
          ansible.builtin.set_fact:
            _target_original_hard_limit_gb: >-
              {{ (quota_target_before.quota_details.thresholds.hard | default(0) | int) / (1024 ** 3) }}
          when: quota_target_before.quota_details is defined

    - name: Resolve whether we'll actually touch the target this run
      ansible.builtin.set_fact:
        _apply_to_target_effective: >-
          {{ (apply_to_target | default(false)) and (replication_found | default(false))
             and (replication_target_site | default('')) != ''
             and (quota_target_before is defined)
             and (quota_target_before.quota_details is defined) }}

    - block:
        - name: "[{{ quota_path }}] (source) Set hard limit to {{ new_quota_gb }}GB"
          dellemc.powerscale.smartquota:
            onefs_host: "{{ site.onefs_host }}"
            port_no: "{{ site.port_no | default(8080) }}"
            verify_ssl: "{{ site.verify_ssl | default(false) }}"
            api_user: "{{ site.api_user }}"
            api_password: "{{ site.api_password }}"
            path: "{{ quota_path }}"
            quota_type: "{{ quota_type }}"
            access_zone: "{{ access_zone }}"
            quota:
              hard_limit_size: "{{ new_quota_gb }}"
              cap_unit: "GB"
            state: "present"
          register: quota_change
          no_log: true

        - name: "[{{ quota_path }}] Source result"
          ansible.builtin.debug:
            msg: >-
              {{ quota_path }}: hard limit changed from {{ _original_hard_limit_gb }}GB
              to {{ new_quota_gb }}GB -
              {{ 'changed' if quota_change.changed else 'already in desired state, no change' }}.

        - name: "[{{ replication_target_path | default('') }}] (target) Set hard limit to {{ new_quota_gb }}GB"
          dellemc.powerscale.smartquota:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            quota_type: "{{ quota_type }}"
            access_zone: "{{ access_zone }}"
            quota:
              hard_limit_size: "{{ new_quota_gb }}"
              cap_unit: "GB"
            state: "present"
          register: quota_target_change
          no_log: true
          when: _apply_to_target_effective

        - name: "[{{ replication_target_path | default('') }}] Target result"
          ansible.builtin.debug:
            msg: >-
              {{ replication_target_path }} ({{ target_site_obj.onefs_host }}): hard limit changed from
              {{ _target_original_hard_limit_gb }}GB to {{ new_quota_gb }}GB -
              {{ 'changed' if quota_target_change.changed else 'already in desired state, no change' }}.
          when: _apply_to_target_effective

      rescue:
        - name: "ROLLBACK [{{ quota_path }}] (source) - restore original hard limit"
          dellemc.powerscale.smartquota:
            onefs_host: "{{ site.onefs_host }}"
            port_no: "{{ site.port_no | default(8080) }}"
            verify_ssl: "{{ site.verify_ssl | default(false) }}"
            api_user: "{{ site.api_user }}"
            api_password: "{{ site.api_password }}"
            path: "{{ quota_path }}"
            quota_type: "{{ quota_type }}"
            access_zone: "{{ access_zone }}"
            quota:
              hard_limit_size: "{{ _original_hard_limit_gb }}"
              cap_unit: "GB"
            state: "present"
          register: rollback_source_result
          ignore_errors: true
          no_log: true

        - name: "ROLLBACK [{{ replication_target_path | default('') }}] (target) - restore original hard limit"
          dellemc.powerscale.smartquota:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            quota_type: "{{ quota_type }}"
            access_zone: "{{ access_zone }}"
            quota:
              hard_limit_size: "{{ _target_original_hard_limit_gb }}"
              cap_unit: "GB"
            state: "present"
          register: rollback_target_result
          ignore_errors: true
          no_log: true
          when: _apply_to_target_effective

        - name: Fail the play - report rollback outcome
          ansible.builtin.fail:
            msg: >-
              The quota change on {{ quota_path }} failed. Source rollback
              {{ 'succeeded' if not rollback_source_result.failed
                 else 'ALSO FAILED - manual verification/intervention needed' }}.
              {{ ('Target rollback ' ~ ('succeeded' if not rollback_target_result.failed else 'ALSO FAILED - manual verification/intervention needed') ~ '.')
                 if _apply_to_target_effective else '' }}
      when: (_original_hard_limit_gb | float | round(2)) != (new_quota_gb | int | round(2))
