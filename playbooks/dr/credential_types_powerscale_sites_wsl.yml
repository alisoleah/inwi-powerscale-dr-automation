---
# WSL / local rehearsal variant of credential_types_powerscale_sites.yml.
# Identical except for the module_defaults block below - the INWI original
# never wires controller_host/username/password into the awx.awx modules
# (same bug found and fixed in provision_awx_project_and_templates_wsl.yml),
# so it silently talks to https://127.0.0.1 instead of whatever
# controller_host was actually set to. Fixed here; port the same fix into
# the INWI original before its first real run there.
#
# Provisions the two custom AWX Credential Types used to inject Site A /
# Site B PowerScale connection details into provision_share.yml /
# provision_replication.yml job runs. Does NOT create the actual
# Credentials (real secret values) - see the separate, uncommitted
# create_site_credentials step for that.

- name: Provision AWX Credential Types for PowerScale site connections (local/WSL rehearsal)
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - awx.awx

  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ controller_host }}"
      controller_username: "{{ controller_username }}"
      controller_password: "{{ controller_password }}"
      validate_certs: "{{ controller_verify_ssl }}"

  vars:
    controller_host: "http://127.0.0.1:33229"
    controller_username: "admin"
    # controller_password: pass via -e, never commit it
    controller_verify_ssl: false

    powerscale_site_credential_fields:
      fields:
        - id: onefs_host
          type: string
          label: "OneFS Host"
          help_text: "IP address or FQDN of this site's PowerScale cluster."
        - id: api_user
          type: string
          label: "API User"
        - id: api_password
          type: string
          label: "API Password"
          secret: true
        - id: network_pool
          type: string
          label: "SyncIQ Network Pool"
          help_text: "Used for source_network/target replication traffic restriction."
        - id: network_subnet
          type: string
          label: "SyncIQ Network Subnet"
      required:
        - onefs_host
        - api_user
        - api_password

  tasks:
    - name: Create/update "PowerScale - Site A" credential type
      awx.awx.credential_type:
        name: "PowerScale - Site A"
        description: >-
          Connection details for PowerScale Site A. Injected into job runs
          as site_a_onefs_host / site_a_api_user / site_a_api_password /
          site_a_network_pool / site_a_network_subnet extra_vars - matches
          what roles/awx_credential_overlay expects.
        kind: cloud
        inputs: "{{ powerscale_site_credential_fields }}"
        injectors:
          extra_vars:
            site_a_onefs_host: "{{ '{{' }} onefs_host {{ '}}' }}"
            site_a_api_user: "{{ '{{' }} api_user {{ '}}' }}"
            site_a_api_password: "{{ '{{' }} api_password {{ '}}' }}"
            site_a_network_pool: "{{ '{{' }} network_pool {{ '}}' }}"
            site_a_network_subnet: "{{ '{{' }} network_subnet {{ '}}' }}"
        state: present

    - name: Create/update "PowerScale - Site B" credential type
      awx.awx.credential_type:
        name: "PowerScale - Site B"
        description: >-
          Connection details for PowerScale Site B. Injected into job runs
          as site_b_onefs_host / site_b_api_user / site_b_api_password /
          site_b_network_pool / site_b_network_subnet extra_vars - matches
          what roles/awx_credential_overlay expects.
        kind: cloud
        inputs: "{{ powerscale_site_credential_fields }}"
        injectors:
          extra_vars:
            site_b_onefs_host: "{{ '{{' }} onefs_host {{ '}}' }}"
            site_b_api_user: "{{ '{{' }} api_user {{ '}}' }}"
            site_b_api_password: "{{ '{{' }} api_password {{ '}}' }}"
            site_b_network_pool: "{{ '{{' }} network_pool {{ '}}' }}"
            site_b_network_subnet: "{{ '{{' }} network_subnet {{ '}}' }}"
        state: present
