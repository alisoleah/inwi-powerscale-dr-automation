---
# Provisions the AWX Project (GitLab-backed OR manual/local-path - your
# choice, see awx_project_scm_type below), a minimal localhost Inventory
# (PowerScale modules talk to clusters over REST API, not SSH - no real
# managed hosts needed), and the 9 Job Templates this repo ships:
#   - PowerScale - Validate Input                    (Survey)
#   - PowerScale - Provision Share                   (extra vars, no Survey)
#   - PowerScale - Provision Share (NFS Only)        (extra vars, no Survey)
#   - PowerScale - Provision Share (SMB Only)        (extra vars, no Survey)
#   - PowerScale - Provision Share (Mixed NFS+SMB)   (extra vars, no Survey)
#   - PowerScale - Manage NFS Client                 (Survey)
#   - PowerScale - Manage SMB Permission             (Survey)
#   - PowerScale - Manage Quota                      (Survey)
#   - PowerScale - Setup Share Replication           (Survey)
# Every template's description carries example extra_vars.
#
# Removed (no longer created here - delete by hand in AWX if present):
#   "PowerScale - Provision Share (Dry Run)" (dry_run is now an extra var)
#   "PowerScale - Provision Replication (SyncIQ Config)" (skeleton; use
#   Setup Share Replication, or dr_site on the Provision Share templates)
#
# Run this ONCE per environment (idempotent - safe to re-run, matches on
# name). Needs the awx.awx collection - same offline install pattern as
# credential_types_powerscale_sites.yml, see that file's header and
# INWI-DR-Deployment-Runbook-*.md Step 5a.
#
# AWX API auth: username + password (matches this engagement's established
# pattern). Pass via -e, environment variables, or a controller_config_file -
# see the awx.awx collection's normal auth options. Self-signed cert on AWX
# itself, same as everywhere else in this environment - controller_verify_ssl
# defaults to false below.
#
# NOTE: like credential_types_powerscale_sites.yml, this stands alone
# because the existing bootstrap_awx_inwi_dr.yml isn't available in this
# repo yet - see playbooks/dr/README.md. Consider merging once retrieved.
#
# NOT YET WRITTEN AGAINST A REAL AWX: built and syntax-checked against the
# documented awx.awx module schemas (verified against the 24.6.1 docs,
# matching the AWX version in this environment), but this sandbox has no
# awx.awx collection available to test end-to-end - same limitation
# credential_types_powerscale_sites.yml already carries. Review the plan
# with --check or a dry look at the AWX UI after first run before trusting
# it blindly in a scripted pipeline.

- name: Provision AWX Project and Job Templates for PowerScale DR automation
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - awx.awx

  # controller_host/username/password/verify_ssl below are just play vars -
  # the awx.awx modules don't read those by name on their own, they need
  # module_defaults (or explicit args per task, or CONTROLLER_* env vars).
  # FOUND VIA A REAL RUN (local rehearsal, not INWI): without this block
  # every awx.awx task below silently connects to https://127.0.0.1 instead
  # of controller_host, and fails with a connection error that looks
  # nothing like an auth problem. Wiring it here so the vars actually work.
  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ controller_host }}"
      controller_username: "{{ controller_username }}"
      controller_password: "{{ controller_password }}"
      validate_certs: "{{ controller_verify_ssl }}"

  vars:
    # ---- AWX connection (override via -e) ----
    controller_host: "https://awx.inwi.lan"
    controller_username: "admin"
    # controller_password: pass via -e, never commit it
    controller_verify_ssl: false

    # ---- Shared ----
    # CHANGE ME: must already exist - this playbook does not create
    # Organizations, only references one by name.
    awx_organization: "Default"
    awx_project_name: "inwi-powerscale-dr-automation"
    ee_name: "PowerScale EE"
    awx_inventory_name: "PowerScale DR - Localhost"

    # ---- Project type: REQUIRED, no default on purpose - forces an
    # ---- explicit choice each run rather than silently defaulting.
    # awx_project_scm_type: "git"     # GitLab-backed - also set:
    #   awx_project_scm_url: "https://gitlab.inwi.local/<group>/inwi-powerscale-dr-automation.git"
    #   awx_project_scm_branch: "main"
    #   gitlab_pat_token: "<token>"          # pass via -e, never commit
    #   gitlab_pat_username: "oauth2"        # or your GitLab username - see runbook
    #
    # awx_project_scm_type: "manual"  # local path - also set:
    #   awx_project_local_path: "inwi-powerscale-dr-automation"  # matches the
    #     directory name you kubectl cp'd into /var/lib/awx/projects/

    # ---- Credential attachment for the two provision_share templates.
    # Leave false until the "PowerScale - Site A" / "PowerScale - Site B"
    # Credentials actually exist (see credential_types_powerscale_sites.yml
    # + creating the real Credentials in the AWX UI) - re-run this playbook
    # with it set true afterward to attach them; safe/idempotent either way.
    attach_site_credentials: false
    site_a_credential_name: "PowerScale - Site A"
    site_b_credential_name: "PowerScale - Site B"

  tasks:
    - name: Assert awx_project_scm_type was explicitly set
      ansible.builtin.assert:
        that:
          - awx_project_scm_type is defined
          - awx_project_scm_type in ['git', 'manual']
        fail_msg: >-
          Set -e awx_project_scm_type=git (GitLab-backed) or
          -e awx_project_scm_type=manual (local path) - see this file's
          header for the additional vars each mode needs.

    # ---- GitLab-backed project ----
    - name: Assert GitLab-specific vars are set
      ansible.builtin.assert:
        that:
          - awx_project_scm_url is defined
          - gitlab_pat_token is defined
        fail_msg: >-
          scm_type=git needs awx_project_scm_url and gitlab_pat_token set
          (-e or environment) - see INWI-DR-Deployment-Runbook-GitLab.md.
      when: awx_project_scm_type == 'git'

    - name: Create/update the GitLab Source Control credential (PAT over HTTPS)
      awx.awx.credential:
        name: "GitLab - INWI Internal (PAT)"
        organization: "{{ awx_organization }}"
        credential_type: "Source Control"
        inputs:
          username: "{{ gitlab_pat_username | default('oauth2') }}"
          password: "{{ gitlab_pat_token }}"
        state: present
      when: awx_project_scm_type == 'git'
      no_log: true

    - name: Create/update the GitLab-backed Project
      awx.awx.project:
        name: "{{ awx_project_name }}"
        organization: "{{ awx_organization }}"
        scm_type: git
        scm_url: "{{ awx_project_scm_url }}"
        scm_branch: "{{ awx_project_scm_branch | default('main') }}"
        credential: "GitLab - INWI Internal (PAT)"
        scm_update_on_launch: true
        scm_clean: true
        wait: true
        state: present
      when: awx_project_scm_type == 'git'

    # ---- Manual (local path) project ----
    - name: Assert manual-mode var is set
      ansible.builtin.assert:
        that:
          - awx_project_local_path is defined
        fail_msg: >-
          scm_type=manual needs awx_project_local_path set - the directory
          name under /var/lib/awx/projects you kubectl cp'd the repo into.
          See INWI-DR-Deployment-Runbook-Local.md.
      when: awx_project_scm_type == 'manual'

    - name: Create/update the manual (local path) Project
      awx.awx.project:
        name: "{{ awx_project_name }}"
        organization: "{{ awx_organization }}"
        scm_type: manual
        local_path: "{{ awx_project_local_path }}"
        wait: true
        state: present
      when: awx_project_scm_type == 'manual'

    # ---- Shared: Inventory ----
    - name: Create/update the localhost-only Inventory
      awx.awx.inventory:
        name: "{{ awx_inventory_name }}"
        organization: "{{ awx_organization }}"
        state: present

    - name: Create/update the localhost host in that Inventory
      awx.awx.host:
        name: "localhost"
        inventory: "{{ awx_inventory_name }}"
        variables:
          ansible_connection: local
        state: present

    # ---- Job Templates ----
    - name: Create/update "PowerScale - Validate Input"
      awx.awx.job_template:
        name: "PowerScale - Validate Input"
        description: |-
          Checks the site connection details (sites.yml with the attached AWX Site A / Site B credentials overlaid). Contacts no cluster.
          Example extra_vars:
          {"target_site": "site_a"}
          target_site: all (default) | site_a | site_b
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/validate_input.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        # FOUND VIA A REAL RUN: without the two site Credentials attached
        # here too, roles/awx_credential_overlay always skips (no
        # site_a_onefs_host/etc extra_vars to overlay), so this template
        # could only ever validate the committed sites.yml - never what a
        # real AWX Credential-based deployment actually injects. Attaching
        # the same credentials as the provisioning templates below fixes
        # that; harmless when attach_site_credentials is still false.
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Target site"
              question_description: >-
                Restrict validation to one site's connection fields. 'all'
                (default) requires every site in sites.yml to be fully
                populated, same as before this field existed. Pick a
                specific site to validate it alone, e.g. while the other
                site's real values are still pending - see
                roles/validate_input/README.md.
              variable: "target_site"
              type: "multiplechoice"
              choices: "all\nsite_a\nsite_b"
              default: "all"
              required: false
        state: present

    # ---- Share provisioning templates (extra_vars driven, no shares.yml) ----
    # All four run playbooks/provision_share.yml - one share per run, every
    # input from extra_vars (see that playbook's header for the full field
    # reference). The protocol-specific templates only differ in the
    # pre-filled skeleton (protocol + which fields are shown).
    - name: Create/update "PowerScale - Provision Share"
      awx.awx.job_template:
        name: "PowerScale - Provision Share"
        description: |-
          Creates ONE share (directory, optional quota, NFS export and/or SMB share) from extra vars; protocol: nfs, smb or "nfs, smb".
          Launch: edit the pre-filled extra vars (no Survey). dry_run: true only prints the plan - set false to create. Replace every CHANGE_ME.
          Lists are comma-separated; empty lists are skipped. NFS: at least one client across nfs_clients / nfs_read_only_clients / nfs_read_write_clients / nfs_root_clients. SMB: at least one "type:name" (user|group|wellknown) across smb_full_control / smb_write / smb_read; use smb_provider_type ads for DOMAIN\name.
          Optional DR (live runs only): set dr_site (plus dr_target_path, dr_schedule e.g. "every 4 hours", dr_policy_name, dr_rpo_alert_minutes) to also create a SyncIQ policy and mirror the share on the DR cluster.
          Example extra_vars:
          {"dry_run": false, "primary_site": "site_a", "share_name": "finance_data", "share_path": "/ifs/data/finance", "protocol": "nfs, smb", "quota_gb": 500, "nfs_clients": "10.10.0.0/16", "smb_write": "group:INWI\\finance_team", "smb_read": "wellknown:Everyone", "smb_provider_type": "ads", "dr_site": "site_b", "dr_schedule": "every 4 hours"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/provision_share.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        # No Survey - too many inputs. The launch dialog shows these
        # extra_vars to edit. Placeholders (CHANGE_ME) fail validation and
        # dry_run defaults to true, so nothing is created by accident.
        survey_enabled: false
        survey_spec: {}
        ask_variables_on_launch: true
        extra_vars:
          dry_run: true
          primary_site: "site_a"
          share_name: "CHANGE_ME"
          share_path: "/ifs/data/CHANGE_ME"
          protocol: "nfs, smb"
          access_zone: "System"
          quota_gb: 0
          nfs_clients: "CHANGE_ME"
          nfs_read_only_clients: ""
          nfs_read_write_clients: ""
          nfs_root_clients: ""
          smb_full_control: ""
          smb_write: ""
          smb_read: "CHANGE_ME"
          smb_provider_type: "local"
          dr_site: ""
          dr_target_path: ""
          dr_policy_name: ""
          dr_schedule: ""
          dr_rpo_alert_minutes: ""
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Provision Share (NFS Only)"
      awx.awx.job_template:
        name: "PowerScale - Provision Share (NFS Only)"
        description: |-
          Creates ONE NFS share (directory, optional quota, NFS export) from extra vars.
          Launch: edit the pre-filled extra vars (no Survey). dry_run: true only prints the plan - set false to create. Replace every CHANGE_ME.
          Lists are comma-separated; empty lists are skipped. NFS: at least one client across nfs_clients / nfs_read_only_clients / nfs_read_write_clients / nfs_root_clients. SMB: at least one "type:name" (user|group|wellknown) across smb_full_control / smb_write / smb_read; use smb_provider_type ads for DOMAIN\name.
          Optional DR (live runs only): set dr_site (plus dr_target_path, dr_schedule e.g. "every 4 hours", dr_policy_name, dr_rpo_alert_minutes) to also create a SyncIQ policy and mirror the share on the DR cluster.
          Example extra_vars:
          {"dry_run": false, "primary_site": "site_a", "share_name": "finance_nfs", "share_path": "/ifs/data/finance", "protocol": "nfs", "quota_gb": 500, "nfs_clients": "10.10.0.0/16, 10.20.0.5", "nfs_read_only_clients": "10.30.0.0/24", "nfs_root_clients": "10.10.0.10"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/provision_share.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        # No Survey - too many inputs. The launch dialog shows these
        # extra_vars to edit. Placeholders (CHANGE_ME) fail validation and
        # dry_run defaults to true, so nothing is created by accident.
        survey_enabled: false
        survey_spec: {}
        ask_variables_on_launch: true
        extra_vars:
          dry_run: true
          primary_site: "site_a"
          share_name: "CHANGE_ME"
          share_path: "/ifs/data/CHANGE_ME"
          protocol: "nfs"
          access_zone: "System"
          quota_gb: 0
          nfs_clients: "CHANGE_ME"
          nfs_read_only_clients: ""
          nfs_read_write_clients: ""
          nfs_root_clients: ""
          dr_site: ""
          dr_target_path: ""
          dr_policy_name: ""
          dr_schedule: ""
          dr_rpo_alert_minutes: ""
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Provision Share (SMB Only)"
      awx.awx.job_template:
        name: "PowerScale - Provision Share (SMB Only)"
        description: |-
          Creates ONE SMB share (directory, optional quota, SMB share + permissions) from extra vars.
          Launch: edit the pre-filled extra vars (no Survey). dry_run: true only prints the plan - set false to create. Replace every CHANGE_ME.
          Lists are comma-separated; empty lists are skipped. NFS: at least one client across nfs_clients / nfs_read_only_clients / nfs_read_write_clients / nfs_root_clients. SMB: at least one "type:name" (user|group|wellknown) across smb_full_control / smb_write / smb_read; use smb_provider_type ads for DOMAIN\name.
          Optional DR (live runs only): set dr_site (plus dr_target_path, dr_schedule e.g. "every 4 hours", dr_policy_name, dr_rpo_alert_minutes) to also create a SyncIQ policy and mirror the share on the DR cluster.
          Example extra_vars:
          {"dry_run": false, "primary_site": "site_a", "share_name": "hr_docs", "share_path": "/ifs/data/hr", "protocol": "smb", "quota_gb": 100, "smb_full_control": "group:INWI\\hr_admins", "smb_write": "group:INWI\\hr_team", "smb_read": "wellknown:Everyone", "smb_provider_type": "ads"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/provision_share.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        # No Survey - too many inputs. The launch dialog shows these
        # extra_vars to edit. Placeholders (CHANGE_ME) fail validation and
        # dry_run defaults to true, so nothing is created by accident.
        survey_enabled: false
        survey_spec: {}
        ask_variables_on_launch: true
        extra_vars:
          dry_run: true
          primary_site: "site_a"
          share_name: "CHANGE_ME"
          share_path: "/ifs/data/CHANGE_ME"
          protocol: "smb"
          access_zone: "System"
          quota_gb: 0
          smb_full_control: ""
          smb_write: ""
          smb_read: "CHANGE_ME"
          smb_provider_type: "local"
          dr_site: ""
          dr_target_path: ""
          dr_policy_name: ""
          dr_schedule: ""
          dr_rpo_alert_minutes: ""
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Provision Share (Mixed NFS+SMB)"
      awx.awx.job_template:
        name: "PowerScale - Provision Share (Mixed NFS+SMB)"
        description: |-
          Creates ONE mixed share (directory, optional quota, NFS export AND SMB share) from extra vars.
          Launch: edit the pre-filled extra vars (no Survey). dry_run: true only prints the plan - set false to create. Replace every CHANGE_ME.
          Lists are comma-separated; empty lists are skipped. NFS: at least one client across nfs_clients / nfs_read_only_clients / nfs_read_write_clients / nfs_root_clients. SMB: at least one "type:name" (user|group|wellknown) across smb_full_control / smb_write / smb_read; use smb_provider_type ads for DOMAIN\name.
          Optional DR (live runs only): set dr_site (plus dr_target_path, dr_schedule e.g. "every 4 hours", dr_policy_name, dr_rpo_alert_minutes) to also create a SyncIQ policy and mirror the share on the DR cluster.
          Example extra_vars:
          {"dry_run": false, "primary_site": "site_a", "share_name": "finance_data", "share_path": "/ifs/data/finance", "protocol": "nfs, smb", "quota_gb": 500, "nfs_clients": "10.10.0.0/16", "smb_write": "group:INWI\\finance_team", "smb_read": "wellknown:Everyone", "smb_provider_type": "ads", "dr_site": "site_b", "dr_schedule": "every 4 hours"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/provision_share.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        # No Survey - too many inputs. The launch dialog shows these
        # extra_vars to edit. Placeholders (CHANGE_ME) fail validation and
        # dry_run defaults to true, so nothing is created by accident.
        survey_enabled: false
        survey_spec: {}
        ask_variables_on_launch: true
        extra_vars:
          dry_run: true
          primary_site: "site_a"
          share_name: "CHANGE_ME"
          share_path: "/ifs/data/CHANGE_ME"
          protocol: "nfs, smb"
          access_zone: "System"
          quota_gb: 0
          nfs_clients: "CHANGE_ME"
          nfs_read_only_clients: ""
          nfs_read_write_clients: ""
          nfs_root_clients: ""
          smb_full_control: ""
          smb_write: ""
          smb_read: "CHANGE_ME"
          smb_provider_type: "local"
          dr_site: ""
          dr_target_path: ""
          dr_policy_name: ""
          dr_schedule: ""
          dr_rpo_alert_minutes: ""
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    # ---- Ad-hoc management templates ----
    # These four point at the standalone manage_*.yml / setup_share_replication.yml
    # playbooks - fully extra_vars/Survey-driven, no shares.yml editing needed
    # for a one-off operation. See each playbook's own header comment for the
    # full field reference and worked examples.
    - name: Create/update "PowerScale - Manage NFS Client"
      awx.awx.job_template:
        name: "PowerScale - Manage NFS Client"
        description: |-
          Adds/removes one client on an EXISTING NFS export.
          Example extra_vars (add):
          {"target_site": "site_a", "export_path": "/ifs/data/finance", "client_ip": "10.20.0.5", "state": "present"}
          Example extra_vars (remove from read-only list, mirror to DR target):
          {"target_site": "site_a", "export_path": "/ifs/data/finance", "client_ip": "10.20.0.5", "client_list": "read_only_clients", "state": "absent", "apply_to_target": "true"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/manage_nfs_client.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Site"
              question_description: "Which PowerScale cluster to operate on."
              variable: "target_site"
              type: "multiplechoice"
              choices: "site_a\nsite_b"
              required: true
            - question_name: "Export path"
              question_description: >-
                Must be an EXISTING NFS export, e.g. /ifs/data/finance.
                This template edits an export's client list - it does not
                create new exports.
              variable: "export_path"
              type: "text"
              required: true
            - question_name: "Client IP or CIDR"
              question_description: "e.g. 10.20.0.5 or 10.20.0.0/24"
              variable: "client_ip"
              type: "text"
              required: true
            - question_name: "Action"
              question_description: "Add or remove this client."
              variable: "state"
              type: "multiplechoice"
              choices: "present\nabsent"
              required: true
            - question_name: "Client list (optional)"
              question_description: >-
                Which client list to edit. Defaults to 'clients' if left
                blank.
              variable: "client_list"
              type: "multiplechoice"
              choices: "clients\nread_only_clients\nread_write_clients\nroot_clients"
              default: "clients"
              required: false
            - question_name: "Access zone (optional)"
              question_description: "Defaults to System if left blank."
              variable: "access_zone"
              type: "text"
              required: false
            - question_name: "Also apply to replication target? (optional)"
              question_description: >-
                If true, checks whether this export is covered by a real
                SyncIQ policy and, if the target already has a matching
                export, mirrors the same change there too. Defaults to
                false (source only) if left blank.
              variable: "apply_to_target"
              type: "multiplechoice"
              choices: "false\ntrue"
              default: "false"
              required: false
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Manage SMB Permission"
      awx.awx.job_template:
        name: "PowerScale - Manage SMB Permission"
        description: |-
          Grants/revokes one permission entry on an EXISTING SMB share.
          Example extra_vars (grant):
          {"target_site": "site_a", "share_name": "finance_data", "trustee_type": "group", "trustee_name": "INWI\\finance_team", "permission": "write", "provider_type": "ads", "state": "present"}
          Example extra_vars (revoke):
          {"target_site": "site_a", "share_name": "finance_data", "trustee_type": "wellknown", "trustee_name": "Everyone", "permission": "read", "state": "absent"}
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/manage_smb_permission.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Site"
              question_description: "Which PowerScale cluster to operate on."
              variable: "target_site"
              type: "multiplechoice"
              choices: "site_a\nsite_b"
              required: true
            - question_name: "SMB share name"
              question_description: >-
                Must be an EXISTING SMB share. This template edits
                permissions - it does not create new shares.
              variable: "share_name"
              type: "text"
              required: true
            - question_name: "Trustee type"
              variable: "trustee_type"
              type: "multiplechoice"
              choices: "user\ngroup\nwellknown"
              required: true
            - question_name: "Trustee name"
              question_description: >-
                e.g. INWI\\finance_team for a group, or 'everyone' for
                wellknown.
              variable: "trustee_name"
              type: "text"
              required: true
            - question_name: "Permission"
              variable: "permission"
              type: "multiplechoice"
              choices: "read\nwrite\nfull"
              required: true
            - question_name: "Action"
              question_description: "Grant or revoke this permission."
              variable: "state"
              type: "multiplechoice"
              choices: "present\nabsent"
              required: true
            - question_name: "Permission type (optional)"
              question_description: "Defaults to 'allow' if left blank."
              variable: "permission_type"
              type: "multiplechoice"
              choices: "allow\ndeny"
              default: "allow"
              required: false
            - question_name: "Provider type (optional)"
              question_description: >-
                Only used when granting a NEW entry. Defaults to 'local'
                if left blank.
              variable: "provider_type"
              type: "multiplechoice"
              choices: "local\nfile\nads\nldap\nnis"
              default: "local"
              required: false
            - question_name: "Access zone (optional)"
              question_description: "Defaults to System if left blank."
              variable: "access_zone"
              type: "text"
              required: false
            - question_name: "Also apply to replication target? (optional)"
              question_description: >-
                If true, checks whether this share's path is covered by a
                real SyncIQ policy and, if the target already has a share
                of the SAME NAME, mirrors the same permission change
                there too. Defaults to false (source only) if left blank.
              variable: "apply_to_target"
              type: "multiplechoice"
              choices: "false\ntrue"
              default: "false"
              required: false
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Manage Quota"
      awx.awx.job_template:
        name: "PowerScale - Manage Quota"
        description: |-
          Resizes the hard limit of an EXISTING quota.
          Example extra_vars:
          {"target_site": "site_a", "quota_path": "/ifs/data/finance", "new_quota_gb": 10}
          Optional: quota_type (default directory), access_zone, apply_to_target
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/manage_quota.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Site"
              question_description: "Which PowerScale cluster to operate on."
              variable: "target_site"
              type: "multiplechoice"
              choices: "site_a\nsite_b"
              required: true
            - question_name: "Quota path"
              question_description: >-
                Must have an EXISTING quota, e.g. /ifs/data/finance. This
                template edits an existing quota's hard limit - it does
                not create new quotas.
              variable: "quota_path"
              type: "text"
              required: true
            - question_name: "New hard limit (GB)"
              variable: "new_quota_gb"
              type: "integer"
              required: true
            - question_name: "Quota type (optional)"
              question_description: "Defaults to 'directory' if left blank."
              variable: "quota_type"
              type: "multiplechoice"
              choices: "directory\nuser\ngroup\ndefault-user\ndefault-group\ndefault-directory"
              default: "directory"
              required: false
            - question_name: "Access zone (optional)"
              question_description: "Defaults to System if left blank."
              variable: "access_zone"
              type: "text"
              required: false
            - question_name: "Also apply to replication target? (optional)"
              question_description: >-
                If true, checks whether this path is covered by a real
                SyncIQ policy and, if the target already has a quota
                there, resizes it to match too. Defaults to false (source
                only) if left blank.
              variable: "apply_to_target"
              type: "multiplechoice"
              choices: "false\ntrue"
              default: "false"
              required: false
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present

    - name: Create/update "PowerScale - Setup Share Replication"
      awx.awx.job_template:
        name: "PowerScale - Setup Share Replication"
        description: |-
          Creates a real SyncIQ policy for an EXISTING share and mirrors export/share/quota onto the target (only if missing).
          Example extra_vars (NFS only):
          {"source_site": "site_a", "target_site": "site_b", "share_path": "/ifs/data/finance", "schedule": "every 4 hours"}
          Example extra_vars (SMB only - path taken from the share):
          {"source_site": "site_a", "target_site": "site_b", "smb_share_name": "hr_docs"}
          Example extra_vars (mixed + quota):
          {"source_site": "site_a", "target_site": "site_b", "share_path": "/ifs/data/finance", "smb_share_name": "finance_data", "quota_gb": 500, "schedule": "every 1 days at 22:00", "rpo_alert_minutes": 60}
          schedule: OneFS format ("every 4 hours", "every 1 days at 22:00"); blank = manual policy
        organization: "{{ awx_organization }}"
        project: "{{ awx_project_name }}"
        playbook: "playbooks/setup_share_replication.yml"
        inventory: "{{ awx_inventory_name }}"
        execution_environment: "{{ ee_name }}"
        job_type: run
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Source site"
              variable: "source_site"
              type: "multiplechoice"
              choices: "site_a\nsite_b"
              required: true
            - question_name: "Target site"
              question_description: "Must differ from the source site."
              variable: "target_site"
              type: "multiplechoice"
              choices: "site_a\nsite_b"
              required: true
            - question_name: "Share path (source) - NFS / mixed"
              question_description: >-
                Path of an EXISTING NFS export on the source, e.g.
                /ifs/data/finance. Leave blank for an SMB-only share (the
                path is then taken from the SMB share below). Fill in
                together with the SMB share name for a mixed share. This
                mirrors an existing share's DR setup - it does not create
                brand-new shares from scratch.
              variable: "share_path"
              type: "text"
              required: false
            - question_name: "SMB share name - SMB / mixed"
              question_description: >-
                Name of an EXISTING SMB share on the source. If set, this
                share and its permissions are mirrored to the target.
                Leave blank for an NFS-only share. At least one of Share
                path / SMB share name is required.
              variable: "smb_share_name"
              type: "text"
              required: false
            - question_name: "Quota size, GB (optional)"
              question_description: >-
                If set, also ensures a matching quota of this size exists
                on the target.
              variable: "quota_gb"
              type: "integer"
              required: false
            - question_name: "Target path (optional)"
              question_description: "Defaults to the same as the source path if left blank."
              variable: "target_path"
              type: "text"
              required: false
            - question_name: "Policy name (optional)"
              question_description: >-
                Defaults to '<last path component>_replication' if left
                blank.
              variable: "policy_name"
              type: "text"
              required: false
            - question_name: "Schedule (optional)"
              question_description: >-
                isidate format, e.g. "every 4 hours". If left blank, the
                policy is created as run_job=manual (you trigger syncs
                yourself) instead of on a schedule.
              variable: "schedule"
              type: "text"
              required: false
            - question_name: "Replication action (optional)"
              question_description: "Defaults to 'sync' if left blank."
              variable: "action"
              type: "multiplechoice"
              choices: "sync\ncopy"
              default: "sync"
              required: false
            - question_name: "Network pool (optional)"
              question_description: >-
                SyncIQ source network pool. Auto-detected if left blank
                and the source cluster has exactly one pool configured;
                otherwise the policy is created with no network
                restriction.
              variable: "network_pool"
              type: "text"
              required: false
            - question_name: "Network subnet (optional)"
              variable: "network_subnet"
              type: "text"
              required: false
            - question_name: "RPO alert, minutes (optional)"
              variable: "rpo_alert_minutes"
              type: "integer"
              required: false
            - question_name: "Create or remove the policy? (optional)"
              question_description: >-
                present (default) creates/ensures the policy. absent
                removes ONLY the SyncIQ policy - it does not delete any
                mirrored target export/share/quota.
              variable: "state"
              type: "multiplechoice"
              choices: "present\nabsent"
              default: "present"
              required: false
        credentials: >-
          {{ [site_a_credential_name, site_b_credential_name] if attach_site_credentials else [] }}
        state: present
