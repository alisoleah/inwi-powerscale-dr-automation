---
# Provisions the two custom AWX Credential Types used to inject Site A /
# Site B PowerScale connection details into provision_share.yml /
# provision_replication.yml job runs, instead of committing real credentials
# into group_vars/all/sites.yml. Pairs with roles/awx_credential_overlay.
#
# Run this ONCE against your AWX instance. Needs AWX connection details
# (controller_host / controller_username+controller_password, or
# controller_oauthtoken) - pass via -e, environment variables, or a
# controller_config_file, per the awx.awx collection's normal auth options.
# Idempotent - safe to re-run (matches on Credential Type name).
#
# NOTE: this file currently stands alone because the existing
# bootstrap_awx_inwi_dr.yml (which already provisions Org/Credential/
# Inventory/Projects/Job Templates/Workflow via the same collection) isn't
# available in this repo yet - see playbooks/dr/README.md. Once retrieved,
# consider merging these two tasks into that playbook instead of running
# this one separately.
#
# This playbook does NOT create the actual Credentials (the real secret
# values) - only the Types. Create one Credential of each type by hand in
# the AWX UI (Resources -> Credentials -> Add) with the real Site A / Site B
# values, then attach both to the relevant Job Templates. Real secrets
# should not be scripted or committed anywhere.

- name: Provision AWX Credential Types for PowerScale site connections
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - awx.awx

  # controller_host/username/password/verify_ssl below are just play vars -
  # the awx.awx modules don't read those by name on their own, they need
  # module_defaults (or explicit args per task, or CONTROLLER_* env vars).
  # FOUND VIA A REAL RUN (local rehearsal, not INWI): without this block
  # every awx.awx task below silently connects to https://127.0.0.1 instead
  # of controller_host, and fails with a connection error that looks
  # nothing like an auth problem. Wiring it here so -e controller_host=...
  # (per this file's header) actually takes effect - same fix applied to
  # provision_awx_project_and_templates.yml.
  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ controller_host }}"
      controller_username: "{{ controller_username }}"
      controller_password: "{{ controller_password }}"
      validate_certs: "{{ controller_verify_ssl }}"

  vars:
    # ---- AWX connection (override via -e) ----
    controller_host: "https://awx.inwi.lan"
    controller_username: "admin"
    # controller_password: pass via -e, never commit it
    controller_verify_ssl: false

    # Fields shared by both site credential types - only the injector
    # extra_vars key prefix (site_a_ / site_b_) differs between them.
    powerscale_site_credential_fields:
      fields:
        - id: onefs_host
          type: string
          label: "OneFS Host"
          help_text: "IP address or FQDN of this site's PowerScale cluster."
        - id: api_user
          type: string
          label: "API User"
        - id: api_password
          type: string
          label: "API Password"
          secret: true
        - id: network_pool
          type: string
          label: "SyncIQ Network Pool"
          help_text: "Used for source_network/target replication traffic restriction."
        - id: network_subnet
          type: string
          label: "SyncIQ Network Subnet"
      required:
        - onefs_host
        - api_user
        - api_password

  tasks:
    - name: Create/update "PowerScale - Site A" credential type
      awx.awx.credential_type:
        name: "PowerScale - Site A"
        description: >-
          Connection details for PowerScale Site A. Injected into job runs
          as site_a_onefs_host / site_a_api_user / site_a_api_password /
          site_a_network_pool / site_a_network_subnet extra_vars - matches
          what roles/awx_credential_overlay expects.
        kind: cloud
        inputs: "{{ powerscale_site_credential_fields }}"
        injectors:
          extra_vars:
            # The {{ '{{' }} ... {{ '}}' }} pattern is deliberate - it
            # produces the literal string "{{ onefs_host }}" as the stored
            # injector template (evaluated later by AWX against the actual
            # Credential's field values at job-run time), without this
            # provisioning playbook trying to resolve onefs_host itself
            # right now (it isn't defined in this play - only in a
            # Credential's own field values at runtime).
            site_a_onefs_host: "{{ '{{' }} onefs_host {{ '}}' }}"
            site_a_api_user: "{{ '{{' }} api_user {{ '}}' }}"
            site_a_api_password: "{{ '{{' }} api_password {{ '}}' }}"
            site_a_network_pool: "{{ '{{' }} network_pool {{ '}}' }}"
            site_a_network_subnet: "{{ '{{' }} network_subnet {{ '}}' }}"
        state: present

    - name: Create/update "PowerScale - Site B" credential type
      awx.awx.credential_type:
        name: "PowerScale - Site B"
        description: >-
          Connection details for PowerScale Site B. Injected into job runs
          as site_b_onefs_host / site_b_api_user / site_b_api_password /
          site_b_network_pool / site_b_network_subnet extra_vars - matches
          what roles/awx_credential_overlay expects.
        kind: cloud
        inputs: "{{ powerscale_site_credential_fields }}"
        injectors:
          extra_vars:
            site_b_onefs_host: "{{ '{{' }} onefs_host {{ '}}' }}"
            site_b_api_user: "{{ '{{' }} api_user {{ '}}' }}"
            site_b_api_password: "{{ '{{' }} api_password {{ '}}' }}"
            site_b_network_pool: "{{ '{{' }} network_pool {{ '}}' }}"
            site_b_network_subnet: "{{ '{{' }} network_subnet {{ '}}' }}"
        state: present
