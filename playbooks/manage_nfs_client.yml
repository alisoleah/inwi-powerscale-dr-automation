---
# Add or remove a single NFS client from an EXISTING export's client list,
# fully ad-hoc via extra_vars/Survey - no shares.yml or sites.yml edits
# needed. Idempotent (module-native add/remove-in-export semantics), with
# automatic rollback of the export's client lists if anything fails after
# the change is made.
#
# INPUTS: every variable below can come from its Survey field, from the
# optional "Input (JSON)" field (input_json - one JSON object; a key there
# wins over the same Survey field), or from extra_vars. They are read as
# inp.<name> (roles/input_resolver). The outcome is printed as a short
# RESULT block at the end and saved to job artifacts (roles/run_result).
#
# Verified against the real installed dellemc.powerscale 3.10.0 collection
# (ansible-doc dellemc.powerscale.nfs) before writing this - in particular:
#   - client_state: present-in-export/absent-in-export is the module's own
#     native incremental add/remove primitive (NOT a full-list replace),
#     so this is naturally idempotent without us diffing lists ourselves.
#   - the module's return value is NFS_export_details (capital NFS) - easy
#     to get wrong, confirmed from the real docs rather than guessed.
#
# Required extra_vars:
#   target_site   site_a | site_b - which PowerScale cluster to operate on
#   export_path   e.g. "/ifs/data/finance" - must be an EXISTING NFS export
#                 (this playbook edits an export's client list, it does not
#                 create new exports - use provision_share.yml for that)
#   client_ip     one or more clients, comma-separated: IPs, CIDRs or
#                 hostnames, e.g. "10.20.0.5" or "10.20.0.5, 10.20.0.0/24"
#   state         present | absent
# Optional:
#   client_list      clients | read_only_clients | read_write_clients | root_clients
#                    (default: clients)
#   access_zone      (default: System)
#   apply_to_target  true | false (default: false) - if true, checks
#                    whether export_path is covered by a REAL SyncIQ
#                    policy on the source cluster (not shares.yml's
#                    declared replication - the live cluster is the
#                    source of truth here), and if so, applies the same
#                    client add/remove to the matching export on the
#                    replication target too. If no policy covers this
#                    path, or the target doesn't already have a matching
#                    export, this is reported and the run falls back to
#                    source-only - it never creates anything on the
#                    target as a side effect. If the target-side change
#                    fails, BOTH source and target are rolled back to
#                    keep them from drifting out of sync with each other.
#
# Example - add a client:
#   ansible-playbook playbooks/manage_nfs_client.yml \
#     -e target_site=site_a \
#     -e export_path=/ifs/data/finance \
#     -e client_ip=10.20.0.5 \
#     -e state=present
#
# Example - remove it again:
#   ansible-playbook playbooks/manage_nfs_client.yml \
#     -e target_site=site_a \
#     -e export_path=/ifs/data/finance \
#     -e client_ip=10.20.0.5 \
#     -e state=absent
#
# Example - AWX Survey / extra_vars JSON (same operation as the first):
#   {
#     "target_site": "site_a",
#     "export_path": "/ifs/data/finance",
#     "client_ip": "10.20.0.5",
#     "state": "present"
#   }

- name: Add/remove an NFS client on an existing export
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/sites.yml

  pre_tasks:
    - name: Overlay AWX-injected site credentials, if present
      ansible.builtin.import_role:
        name: awx_credential_overlay

    # Inputs come from the Survey fields and/or the "Input (JSON)" field
    # (JSON wins) - every input below is read as inp.<name>.
    - name: Resolve inputs (Survey fields and/or Input (JSON))
      ansible.builtin.import_role:
        name: input_resolver
      vars:
        input_keys: ['target_site', 'export_path', 'client_ip', 'state', 'client_list', 'access_zone', 'apply_to_target']

    - name: Assert required extra_vars are present and valid
      ansible.builtin.assert:
        that:
          - inp.target_site is defined
          - inp.target_site in sites
          - inp.export_path is defined
          - inp.export_path | length > 0
          - inp.client_ip is defined
          - inp.client_ip | length > 0
          - inp.state is defined
          - inp.state in ['present', 'absent']
        fail_msg: >-
          Required: target_site (one of {{ sites.keys() | join(', ') }}),
          export_path, client_ip, state (present|absent).

    - name: Apply input defaults
      ansible.builtin.set_fact:
        inp: "{{ inp | combine({'client_list': inp.client_list | default('clients') , 'access_zone': inp.access_zone | default('System') }) }}"

    - name: Resolve working variables
      ansible.builtin.set_fact:
        site: "{{ sites[inp.target_site] }}"
        _clients: "{{ (inp.client_ip | string).split(',') | map('trim') | reject('equalto', '') | unique | list }}"
      no_log: true

    - name: Validate the client list
      ansible.builtin.assert:
        that:
          - _clients | length > 0
          - _clients | reject('match', '^[A-Za-z0-9.:/_*@-]+$') | list | length == 0
        fail_msg: >-
          client_ip must be one or more IPs / CIDRs / hostnames, comma-separated.
          Invalid: {{ _clients | reject('match', '^[A-Za-z0-9.:/_*@-]+$') | list }}

    - name: Validate client_list value
      ansible.builtin.assert:
        that:
          - inp.client_list in ['clients', 'read_only_clients', 'read_write_clients', 'root_clients']
        fail_msg: "client_list must be one of: clients, read_only_clients, read_write_clients, root_clients"

    - name: Fail fast if the target site still has CHANGE_ME / missing fields
      ansible.builtin.assert:
        that:
          - site.onefs_host is defined
          - site.onefs_host | length > 0
          - site.onefs_host != "CHANGE_ME"
          - site.api_user is defined
          - site.api_user | length > 0
          - site.api_password is defined
          - site.api_password | length > 0
          - site.api_password != "CHANGE_ME"
        fail_msg: >-
          Site '{{ inp.target_site }}' is missing required connection fields or
          still has a CHANGE_ME placeholder - check sites.yml / the
          attached AWX Credential.
      no_log: true

  tasks:
    - name: Capture the export's current state (for rollback + existence check)
      # check_mode: true here is deliberate and load-bearing - this module
      # supports check_mode, and without it a plain state=present call on a
      # path with NO existing export would silently CREATE a bare one as a
      # side effect of merely "checking" - exactly the kind of accidental
      # creation this ad-hoc playbook must never do.
      dellemc.powerscale.nfs:
        onefs_host: "{{ site.onefs_host }}"
        port_no: "{{ site.port_no | default(8080) }}"
        verify_ssl: "{{ site.verify_ssl | default(false) }}"
        api_user: "{{ site.api_user }}"
        api_password: "{{ site.api_password }}"
        path: "{{ inp.export_path }}"
        access_zone: "{{ inp.access_zone }}"
        state: "present"
      check_mode: true
      register: nfs_before

    # The dellemc.powerscale modules ALWAYS return their *_details key -
    # {} (nfs, synciqpolicy) or None (smartquota) when nothing exists - so
    # 'is defined' is always true. Test for emptiness instead.
    - name: Fail fast if no export exists yet at this path
      ansible.builtin.fail:
        msg: >-
          No existing NFS export found at '{{ inp.export_path }}' on
          {{ site.onefs_host }} - this playbook only edits an EXISTING
          export's client list, it does not create new exports (use
          provision_share.yml for that).
      when: (nfs_before.NFS_export_details | default({}, true) | length == 0)

    - name: "[{{ inp.export_path }}] Current client lists (before)"
      ansible.builtin.debug:
        msg:
          clients: "{{ nfs_before.NFS_export_details.clients | default([]) }}"
          read_only_clients: "{{ nfs_before.NFS_export_details.read_only_clients | default([]) }}"
          read_write_clients: "{{ nfs_before.NFS_export_details.read_write_clients | default([]) }}"
          root_clients: "{{ nfs_before.NFS_export_details.root_clients | default([]) }}"

    - name: Resolve apply_to_target
      ansible.builtin.set_fact:
        _apply_req: "{{ inp.apply_to_target | default(false) | bool }}"

    - name: Check for a real replication target, if requested
      ansible.builtin.include_role:
        name: resolve_replication_target
      vars:
        source_path: "{{ inp.export_path }}"
      when: _apply_req | bool

    - name: Report replication discovery result
      ansible.builtin.debug:
        msg: >-
          {{ 'No SyncIQ policy covers ' ~ inp.export_path ~ ' on ' ~ site.onefs_host ~ ' - applying to source only.'
             if not (replication_found | default(false) | bool)
             else ('Replication target is ' ~ replication_target_site ~ ', but that site is not defined in sites.yml - applying to source only.'
                   if (replication_target_site | default('')) == ''
                   else 'Replication target resolved: ' ~ replication_target_site ~ ' (' ~ replication_target_path ~ ').') }}
      when: _apply_req | bool

    - name: Check whether the target export actually exists
      when: (_apply_req | bool) and (replication_found | default(false) | bool) and (replication_target_site | default('')) != ''
      block:
        - name: Resolve target site connection details
          ansible.builtin.set_fact:
            target_site_obj: "{{ sites[replication_target_site] }}"
          no_log: true

        - name: Check whether the target export exists (read-only)
          dellemc.powerscale.nfs:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            access_zone: "{{ inp.access_zone }}"
            state: "present"
          check_mode: true
          register: nfs_target_before

        - name: Report if the target export is missing
          ansible.builtin.debug:
            msg: >-
              No NFS export found at {{ replication_target_path }} on
              {{ target_site_obj.onefs_host }} (the replication target) -
              applying to source only.
          when: (nfs_target_before.NFS_export_details | default({}, true) | length == 0)

    - name: Resolve whether we'll actually touch the target this run
      ansible.builtin.set_fact:
        _apply_to_target_effective: >-
          {{ (_apply_req | bool) and (replication_found | default(false) | bool)
             and (replication_target_site | default('')) != ''
             and (nfs_target_before is defined)
             and ((nfs_target_before.NFS_export_details | default({}, true) | length > 0)) }}

    - block:
        - name: "[{{ inp.export_path }}] (source) {{ 'Add' if inp.state == 'present' else 'Remove' }} {{ _clients | join(', ') }} {{ 'to' if inp.state == 'present' else 'from' }} {{ inp.client_list }}"
          dellemc.powerscale.nfs:
            onefs_host: "{{ site.onefs_host }}"
            port_no: "{{ site.port_no | default(8080) }}"
            verify_ssl: "{{ site.verify_ssl | default(false) }}"
            api_user: "{{ site.api_user }}"
            api_password: "{{ site.api_password }}"
            path: "{{ inp.export_path }}"
            access_zone: "{{ inp.access_zone }}"
            client_state: "{{ 'present-in-export' if inp.state == 'present' else 'absent-in-export' }}"
            state: "present"
          args: "{{ {inp.client_list: _clients} }}"
          register: nfs_change

        - name: "[{{ inp.export_path }}] Source result"
          ansible.builtin.debug:
            msg: >-
              {{ _clients | join(', ') }} {{ 'added to' if inp.state == 'present' else 'removed from' }}
              {{ inp.client_list }} on {{ inp.export_path }} -
              {{ 'changed' if nfs_change.changed else 'already in desired state, no change' }}.

        - name: "[{{ replication_target_path | default('') }}] (target) {{ 'Add' if inp.state == 'present' else 'Remove' }} {{ _clients | join(', ') }} {{ 'to' if inp.state == 'present' else 'from' }} {{ inp.client_list }}"
          dellemc.powerscale.nfs:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            access_zone: "{{ inp.access_zone }}"
            client_state: "{{ 'present-in-export' if inp.state == 'present' else 'absent-in-export' }}"
            state: "present"
          args: "{{ {inp.client_list: _clients} }}"
          register: nfs_target_change
          when: _apply_to_target_effective | bool

        - name: "[{{ replication_target_path | default('') }}] Target result"
          ansible.builtin.debug:
            msg: >-
              {{ _clients | join(', ') }} {{ 'added to' if inp.state == 'present' else 'removed from' }}
              {{ inp.client_list }} on {{ replication_target_path }} ({{ target_site_obj.onefs_host }}) -
              {{ 'changed' if nfs_target_change.changed else 'already in desired state, no change' }}.
          when: _apply_to_target_effective | bool

      rescue:
        - name: "ROLLBACK [{{ inp.export_path }}] (source) - restore original client lists"
          dellemc.powerscale.nfs:
            onefs_host: "{{ site.onefs_host }}"
            port_no: "{{ site.port_no | default(8080) }}"
            verify_ssl: "{{ site.verify_ssl | default(false) }}"
            api_user: "{{ site.api_user }}"
            api_password: "{{ site.api_password }}"
            path: "{{ inp.export_path }}"
            access_zone: "{{ inp.access_zone }}"
            clients: "{{ nfs_before.NFS_export_details.clients | default([]) }}"
            read_only_clients: "{{ nfs_before.NFS_export_details.read_only_clients | default([]) }}"
            read_write_clients: "{{ nfs_before.NFS_export_details.read_write_clients | default([]) }}"
            root_clients: "{{ nfs_before.NFS_export_details.root_clients | default([]) }}"
            state: "present"
          register: rollback_source_result
          ignore_errors: true

        - name: "ROLLBACK [{{ replication_target_path | default('') }}] (target) - restore original client lists"
          dellemc.powerscale.nfs:
            onefs_host: "{{ target_site_obj.onefs_host }}"
            port_no: "{{ target_site_obj.port_no | default(8080) }}"
            verify_ssl: "{{ target_site_obj.verify_ssl | default(false) }}"
            api_user: "{{ target_site_obj.api_user }}"
            api_password: "{{ target_site_obj.api_password }}"
            path: "{{ replication_target_path }}"
            access_zone: "{{ inp.access_zone }}"
            clients: "{{ nfs_target_before.NFS_export_details.clients | default([]) }}"
            read_only_clients: "{{ nfs_target_before.NFS_export_details.read_only_clients | default([]) }}"
            read_write_clients: "{{ nfs_target_before.NFS_export_details.read_write_clients | default([]) }}"
            root_clients: "{{ nfs_target_before.NFS_export_details.root_clients | default([]) }}"
            state: "present"
          register: rollback_target_result
          ignore_errors: true
          when: _apply_to_target_effective | bool

        - name: Fail the play - report rollback outcome
          ansible.builtin.fail:
            msg: >-
              The change to {{ inp.export_path }} failed. Source rollback
              {{ 'succeeded' if not rollback_source_result.failed
                 else 'ALSO FAILED - manual verification/intervention needed' }}.
              {{ ('Target rollback ' ~ ('succeeded' if not rollback_target_result.failed else 'ALSO FAILED - manual verification/intervention needed') ~ '.')
                 if (_apply_to_target_effective | bool) else '' }}

    - name: RESULT
      ansible.builtin.include_role:
        name: run_result
      vars:
        result_title: "Manage NFS Client - {{ inp.target_site }} {{ inp.export_path }}"
        result_status: "{{ 'CHANGED' if (nfs_change.changed | default(false)) or (nfs_target_change.changed | default(false)) else 'NO CHANGE' }}"
        result_lines:
          - "{{ inp.target_site }} ({{ site.onefs_host }}): {{ _clients | join(', ') }} {{ 'added to' if inp.state == 'present' else 'removed from' }} {{ inp.client_list }} - {{ 'CHANGED' if (nfs_change.changed | default(false)) else 'no change needed' }}"
          - "{{ (('DR ' ~ target_site_obj.onefs_host ~ ' ' ~ (replication_target_path | default('')) ~ ': ' ~ ('CHANGED' if (nfs_target_change.changed | default(false)) else 'no change needed'))
                if (_apply_to_target_effective | default(false) | bool)
                else ('DR target: not changed - '
                      ~ ('no SyncIQ policy covers this path' if not (replication_found | default(false) | bool)
                         else ('policy target is not a site in sites.yml' if (replication_target_site | default('')) == ''
                               else 'no matching object on the target'))
                      if (_apply_req | default(false) | bool) else 'DR target: not requested')) }}"
