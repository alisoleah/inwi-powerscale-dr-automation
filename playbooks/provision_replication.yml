---
# SKELETON entrypoint - see roles/powerscale_provision_replication/README.md.
# Safe to run as-is (it only prints a plan, no real synciqpolicy calls are
# made yet), but won't create anything real until that role is finished.

- name: Provision SyncIQ replication policies on PowerScale (Phase 2 - SKELETON)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/sites.yml
    - ../group_vars/all/shares.yml

  pre_tasks:
    - name: Validate input before touching any cluster
      ansible.builtin.import_role:
        name: validate_input

  tasks:
    - name: Provision replication policy for each share
      ansible.builtin.include_role:
        name: powerscale_provision_replication
      vars:
        share: "{{ item }}"
        site: "{{ sites[item.primary_site] }}"
        target_site: "{{ sites[item.replication.target_site] }}"
      loop: "{{ shares }}"
      loop_control:
        label: "{{ item.name }}"
