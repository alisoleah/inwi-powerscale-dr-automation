---
# Pure local validation of sites.yml / shares.yml. Does NOT contact any
# PowerScale cluster - no dellemc.powerscale module is used anywhere in
# this file. Import this role at the top of every playbook that consumes
# sites.yml / shares.yml so bad input is caught before any API call.
#
# Run standalone at any time with: ansible-playbook playbooks/validate_input.yml

- name: Fail fast if sites is not defined or empty
  ansible.builtin.assert:
    that:
      - sites is defined
      - sites is mapping
      - sites | length > 0
    fail_msg: "sites.yml must define a non-empty 'sites' dictionary. See group_vars/all/sites.yml."
    success_msg: "sites dictionary present ({{ sites | default({}) | length }} site(s))."

# target_site is an OPTIONAL global extra_var (AWX Survey field, or
# -e target_site=...) restricting a run to a single site instead of every
# site in sites.yml - e.g. useful to validate/provision against site_a
# while site_b still has CHANGE_ME placeholders pending from INWI. Computed
# once here (not duplicated per-playbook) since every playbook that touches
# sites.yml imports this role first - see this file's own header comment.
- name: Resolve target_site (defaults to 'all')
  ansible.builtin.set_fact:
    target_site: "{{ target_site | default('all') }}"

- name: Fail fast if target_site isn't a real site key (or 'all')
  ansible.builtin.assert:
    that:
      - target_site in (['all'] + (sites.keys() | list))
    fail_msg: >-
      target_site '{{ target_site }}' not found in sites.yml - valid values:
      all, {{ sites.keys() | join(', ') }}.

- name: Resolve active_sites (all of sites.yml, or just target_site)
  ansible.builtin.set_fact:
    active_sites: "{{ sites if target_site == 'all' else { target_site: sites[target_site] } }}"

- name: Validate each active site has required connection fields, and none are still CHANGE_ME or empty
  ansible.builtin.assert:
    that:
      - sites[item].onefs_host is defined
      - sites[item].onefs_host | length > 0
      - sites[item].onefs_host != "CHANGE_ME"
      - sites[item].api_user is defined
      - sites[item].api_user | length > 0
      - sites[item].api_user != "CHANGE_ME"
      - sites[item].api_password is defined
      - sites[item].api_password | length > 0
      - sites[item].api_password != "CHANGE_ME"
      - sites[item].network_pool is defined
      - sites[item].network_pool | length > 0
      - sites[item].network_pool != "CHANGE_ME"
      - sites[item].network_subnet is defined
      - sites[item].network_subnet | length > 0
      - sites[item].network_subnet != "CHANGE_ME"
    fail_msg: >-
      Site '{{ item }}' is missing a required field (onefs_host, api_user,
      api_password, network_pool, network_subnet), one is empty, or one still
      has a CHANGE_ME placeholder value - edit group_vars/all/sites.yml (or
      check the attached AWX Credential's optional fields aren't blank)
      before running against a real cluster.
  # Only validates active_sites (all sites, or just target_site if set) -
  # a site excluded from this run via target_site is allowed to keep
  # CHANGE_ME placeholders without blocking it. Looping over just the site
  # NAMES (not `active_sites | dict2items`, which would put the whole value
  # dict - including api_password - into `item`) means a failed assertion's
  # dumped loop context never contains the actual password value, without
  # needing a blanket no_log: true that would also hide the fail_msg above.
  loop: "{{ active_sites.keys() | list }}"
  loop_control:
    label: "{{ item }}"

- name: Fail fast if shares is not defined or empty
  ansible.builtin.assert:
    that:
      - shares is defined
      - shares is sequence
      - shares | length > 0
    fail_msg: "shares.yml must define a non-empty 'shares' list. See group_vars/all/shares.yml."
    success_msg: "shares list present ({{ shares | default([]) | length }} share(s))."

- name: Fail if share names are not unique
  ansible.builtin.assert:
    that:
      - (shares | map(attribute='name') | list | unique | length) == (shares | length)
    fail_msg: "Duplicate share name(s) detected in shares.yml - every share must have a unique 'name'."

- name: Validate each share's basic fields (name, path, protocol, primary_site)
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.name is match("^[a-zA-Z0-9_-]+$")
      - item.path is defined
      - item.path is match("^/ifs/")
      - item.protocol is defined
      - item.protocol is sequence
      - item.protocol | length > 0
      - (item.protocol | difference(['nfs', 'smb'])) | length == 0
      - item.primary_site is defined
      - item.primary_site in sites
    fail_msg: >-
      Share '{{ item.name | default('(unnamed)') }}' failed basic validation - check
      name (alphanumeric/underscore/hyphen only), path (must start with /ifs/),
      protocol (non-empty list containing only 'nfs' and/or 'smb'), and
      primary_site (must match a key in sites.yml).
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

- name: Validate quota_gb is a positive integer when set
  ansible.builtin.assert:
    that:
      - item.quota_gb | int > 0
    fail_msg: "Share '{{ item.name }}': quota_gb must be a positive integer if set."
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.quota_gb is defined

- name: Validate nfs_clients is present and non-empty when protocol includes nfs
  ansible.builtin.assert:
    that:
      - item.nfs_clients is defined
      - item.nfs_clients | length > 0
    fail_msg: "Share '{{ item.name }}': protocol includes 'nfs' but nfs_clients is missing or empty."
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'nfs' in item.protocol"

- name: Validate smb_permissions is present and non-empty when protocol includes smb
  ansible.builtin.assert:
    that:
      - item.smb_permissions is defined
      - item.smb_permissions | length > 0
    fail_msg: "Share '{{ item.name }}': protocol includes 'smb' but smb_permissions is missing or empty."
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'smb' in item.protocol"

- name: Validate each smb_permissions entry has a user or group, and a valid permission
  ansible.builtin.assert:
    that:
      - (item.1.user is defined) or (item.1.group is defined)
      - item.1.permission is defined
      - item.1.permission in ['read', 'write', 'full']
    fail_msg: >-
      Share '{{ item.0.name }}': each smb_permissions entry needs a 'user' or
      'group' key, and 'permission' must be one of read / write / full (the
      exact values the dellemc.powerscale.smb module accepts - NOT
      read_write / full_control).
  loop: "{{ shares | subelements('smb_permissions', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: "'smb' in item.0.protocol"

- name: Validate replication block is present and internally consistent
  ansible.builtin.assert:
    that:
      - item.replication is defined
      - item.replication.target_site is defined
      - item.replication.target_site in sites
      - item.replication.target_site != item.primary_site
      - item.replication.schedule is defined
      - item.replication.schedule | length > 0
    fail_msg: >-
      Share '{{ item.name }}': replication block invalid - target_site must be
      a valid site key different from primary_site, and schedule must be a
      non-empty string.
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate rpo_alert_minutes is a positive integer when set
  ansible.builtin.assert:
    that:
      - item.replication.rpo_alert_minutes | int > 0
    fail_msg: "Share '{{ item.name }}': replication.rpo_alert_minutes must be a positive integer if set."
  loop: "{{ shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.replication is defined and item.replication.rpo_alert_minutes is defined

- name: All input validated successfully
  ansible.builtin.debug:
    msg: >-
      sites.yml and shares.yml passed all validation checks
      ({{ sites | length }} site(s), {{ shares | length }} share(s)).
      No PowerScale cluster has been contacted yet.
