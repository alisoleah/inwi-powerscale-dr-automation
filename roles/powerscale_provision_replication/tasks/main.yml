#      still unknown.
#
#   4. Target reachability for API calls THIS repo makes directly to the
#      target cluster (info / synciqtargetreports in later phases) - can
#      AWX's control plane reach site_b's onefs_host directly (same as
#      site_a), or does it need a jump host or separate credential? See
#      point 5 for whether synciqpolicy itself also needs a target
#      credential - unresolved as of this writing.
#
#   5. Whether the policy needs target_certificate_id/target_certificate_name
#      (TLS cert exchange between clusters, mutually exclusive with each
#      other), a target_cluster.password field, or plain trust is acceptable
#      in this environment. UNRESOLVED - two rounds of checking the rendered
#      upstream docs (github.com/dell/ansible-powerscale, main branch,
#      full-page fetch both times) show target_cluster's fields as only
#      target_host/target_path/target_certificate_id/target_certificate_name
#      - no password. A second review disputed this, citing specific source
#      lines in synciqpolicy.py and a "with target password" example that
#      doesn't appear in the rendered docs I fetched. I could not fetch the
#      raw .py source to settle it directly. The Terraform provider for
#      PowerScale (a separate codebase, same underlying OneFS API) DOES have
#      a top-level target password field, which may be what got cited
#      instead of the Ansible module.
#      DEFINITIVE ANSWER: run this on the box with the real 3.10.0 collection
#      installed (pscale-dr-automation has it vendored already):
#        ansible-doc dellemc.powerscale.synciqpolicy | grep -A5 target_cluster
#      That reads directly from the installed module's own DOCUMENTATION
#      string - no doc-generation lag, no version mismatch, no ambiguity.
#      If it shows a password sub-option, uncomment the target_cluster.password
#      line below and set it to target_site.api_password. If not, the
#      cert-exchange question is the real remaining piece of #5.
#
# check_mode/diff: synciqpolicy DOES support check_mode/diff per the
# dellemc.powerscale changelog ("Added check and diff mode support for
# synciqpolicy module") - safe to test with --check once this is wired up,
# in addition to replication_dry_run below.
# ============================================================================

- name: Assert required role inputs are present
  ansible.builtin.assert:
    that:
      - share is defined
      - share.replication is defined
      - share.replication.target_site is defined
      - site is defined
      - site.onefs_host is defined
      - target_site is defined
      - target_site.onefs_host is defined
    fail_msg: >-
      powerscale_provision_replication requires 'share', 'site' (source),
      and 'target_site' (resolved target sites.yml entry) vars - see
      playbooks/provision_replication.yml for the expected pattern.

# synciq_policy_name is an OPTIONAL global extra_var (AWX Survey field on
# the "PowerScale - Provision Replication (SyncIQ Config)" Job Template, or
# -e synciq_policy_name=...). Overrides the default naming convention
# below. This override is safe to use today - it's orthogonal to the 5
# open questions blocking the actual synciqpolicy task, which is why it's
# wired in even though that task stays commented out.
- name: "[{{ share.name }}] Resolve effective SyncIQ policy name"
  ansible.builtin.set_fact:
    _synciq_policy_name: "{{ synciq_policy_name | default(share.name ~ '_replication') }}"

- name: "[{{ share.name }}] SKELETON - report what a SyncIQ policy WOULD look like"
  ansible.builtin.debug:
    msg: >-
      Would create SyncIQ policy '{{ _synciq_policy_name }}'
      {{ '(custom name)' if synciq_policy_name is defined else '(default naming convention - pass synciq_policy_name to override)' }}
      replicating {{ share.path }} from {{ site.onefs_host }} (source, pool
      {{ site.network_pool }}) to {{ target_site.onefs_host }} (target),
      schedule '{{ share.replication.schedule }}'. NOT YET IMPLEMENTED -
      see this role's tasks/main.yml header for the 5 open questions
      blocking real implementation.

