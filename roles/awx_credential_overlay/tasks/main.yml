---
# Overlays AWX-injected per-site credentials onto the `sites` dict loaded
# from group_vars/all/sites.yml, when present. Pairs with the two custom
# AWX Credential Types defined in playbooks/dr/credential_types_powerscale_sites.yml
# ("PowerScale - Site A" / "PowerScale - Site B").
#
# This lets the exact same playbooks/roles run two ways with zero branching
# in the calling playbooks themselves:
#   - Local/dev: sites.yml supplies everything (CHANGE_ME still caught by
#     validate_input as usual, since this role runs BEFORE validate_input)
#   - Under AWX: the Job Template has the two custom Credentials attached,
#     AWX injects site_a_onefs_host / site_a_api_user / site_a_api_password /
#     site_a_network_pool / site_a_network_subnet (and the site_b_*
#     equivalents) as extra_vars, and this role overlays those onto
#     sites.site_a / sites.site_b - so validate_input always checks the
#     FINAL effective values regardless of which path supplied them.
#
# Only overlays a site if ALL THREE required fields for it are present
# (onefs_host/api_user/api_password) - a partially-set credential is left
# alone rather than silently merged, so a misconfigured Credential Type in
# AWX surfaces as validate_input's normal CHANGE_ME failure instead of a
# confusing partial-merge state.
#
# network_pool/network_subnet are OPTIONAL. AWX injects them as '' when
# left blank in the Credential; that empty value is kept as-is (it used to
# fall back to sites.yml's CHANGE_ME placeholder, which then failed
# validate_input). Empty means: Setup Share Replication auto-detects the
# source pool, or creates the policy without a network restriction.

- name: Overlay AWX-injected Site A credential onto sites.site_a, if present
  ansible.builtin.set_fact:
    sites: "{{ sites | combine({
        'site_a': sites.site_a | combine({
          'onefs_host': site_a_onefs_host,
          'api_user': site_a_api_user,
          'api_password': site_a_api_password,
          'network_pool': site_a_network_pool | default(''),
          'network_subnet': site_a_network_subnet | default(''),
        }, recursive=True)
      }, recursive=True) }}"
  when:
    - sites is defined
    - sites.site_a is defined
    - site_a_onefs_host is defined
    - site_a_api_user is defined
    - site_a_api_password is defined
  no_log: true

- name: Overlay AWX-injected Site B credential onto sites.site_b, if present
  ansible.builtin.set_fact:
    sites: "{{ sites | combine({
        'site_b': sites.site_b | combine({
          'onefs_host': site_b_onefs_host,
          'api_user': site_b_api_user,
          'api_password': site_b_api_password,
          'network_pool': site_b_network_pool | default(''),
          'network_subnet': site_b_network_subnet | default(''),
        }, recursive=True)
      }, recursive=True) }}"
  when:
    - sites is defined
    - sites.site_b is defined
    - site_b_onefs_host is defined
    - site_b_api_user is defined
    - site_b_api_password is defined
  no_log: true

# SyncIQ target passwords come from a separate, optional credential
# ("PowerScale - SyncIQ Target Passwords"), so they are overlaid on their
# own - not tied to the Site A / Site B credentials being attached.
- name: Overlay optional SyncIQ target passwords, if present
  ansible.builtin.set_fact:
    sites: "{{ sites | combine({
        item: sites[item] | combine({'synciq_password': lookup('ansible.builtin.vars', item ~ '_synciq_password')})
      }, recursive=True) }}"
  loop: "{{ ['site_a', 'site_b'] | select('in', sites | default({})) | list }}"
  loop_control:
    label: "{{ item }}"
  when: (lookup('ansible.builtin.vars', item ~ '_synciq_password', default='') | string | length) > 0
  no_log: true
