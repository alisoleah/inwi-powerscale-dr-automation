---
# Provisions ONE share on ONE site. Inputs are built by
# playbooks/provision_share.yml from extra_vars (no shares.yml):
#
#   site   - sites[primary_site] (connection details, AWX credentials overlaid)
#   share  - {
#     name, path, access_zone, protocol: [nfs] | [smb] | [nfs, smb],
#     quota_gb (only present when > 0), owner (optional),
#     nfs_clients, nfs_read_only_clients, nfs_read_write_clients,
#     nfs_root_clients                      - lists, may be empty
#     smb_permissions                       - list in dellemc.powerscale.smb
#                                             INPUT shape (user_name /
#                                             group_name / wellknown, permission,
#                                             permission_type, provider_type)
#     smb_permission_labels                 - same entries as text, for output
#   }
#   share_dry_run - true: print the plan only, contact no cluster

- name: Assert required role inputs are present
  ansible.builtin.assert:
    that:
      - share is defined
      - share.name is defined
      - share.path is defined
      - share.protocol is defined
      - site is defined
      - site.onefs_host is defined
    fail_msg: >-
      powerscale_provision_share requires 'share' and 'site' vars to be set
      by the caller - see playbooks/provision_share.yml.

- name: "[{{ share.name }}] DRY RUN - report planned actions (no changes made)"
  ansible.builtin.debug:
    msg:
      - "Would ensure directory {{ share.path }} on {{ site.onefs_host }} (zone {{ share.access_zone | default('System') }})
         {{ ('with a ' ~ share.quota_gb ~ 'GB quota') if share.quota_gb is defined else '(no quota)' }}."
      - "{{ ('Would ensure NFS export ' ~ share.path ~ ' - clients: [' ~ (share.nfs_clients | join(', ')) ~ '], read-only: ['
             ~ (share.nfs_read_only_clients | join(', ')) ~ '], read-write: [' ~ (share.nfs_read_write_clients | join(', '))
             ~ '], root: [' ~ (share.nfs_root_clients | join(', ')) ~ ']')
            if 'nfs' in share.protocol else 'No NFS export.' }}"
      - "{{ ('Would ensure SMB share ' ~ share.name ~ ' with permissions: '
             ~ (share.smb_permission_labels | join(', ')))
            if 'smb' in share.protocol else 'No SMB share.' }}"
  when: share_dry_run | bool

- name: "[{{ share.name }}] Ensure directory (and quota, if requested)"
  ansible.builtin.include_tasks: filesystem.yml
  when: not (share_dry_run | bool)

- name: "[{{ share.name }}] Ensure NFS export"
  ansible.builtin.include_tasks: nfs.yml
  when:
    - not (share_dry_run | bool)
    - "'nfs' in share.protocol"

- name: "[{{ share.name }}] Ensure SMB share"
  ansible.builtin.include_tasks: smb.yml
  when:
    - not (share_dry_run | bool)
    - "'smb' in share.protocol"
