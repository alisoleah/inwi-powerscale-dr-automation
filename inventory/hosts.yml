---
# dellemc.powerscale modules talk to each cluster over its REST API
# (onefs_host/api_user/api_password module args), not SSH - so there are no
# real managed hosts here. Every playbook in this repo runs against
# localhost and reaches out to PowerScale clusters via HTTPS instead.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
